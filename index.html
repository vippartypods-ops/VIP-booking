function renderRecordHistories(b){
  const m=getMeta(b);const ph=document.getElementById('record-payment-history');
  ph.innerHTML=m.payments.length?m.payments.map((x,i)=>`<div class="mini-ledger-row"><span>${String(x.at||'').slice(0,10)}</span><span>${x.type||'Payment'}</span><span>${x.method||'Manual'}</span><strong style="color:#34D399">${money(x.amount)}</strong><button class="record-action" onclick="removePaymentRecord(${i})">×</button></div>`).join(''):'<div style="font-size:12px;color:rgba(255,255,255,.3)">No individual payments logged yet.</div>';
  const ah=document.getElementById('record-audit-history');ah.innerHTML=m.audit.length?m.audit.map(x=>`<div class="timeline-item">${x.text}<div class="timeline-time">${new Date(x.at).toLocaleString()}</div></div>`).join(''):'<div class="timeline-item">No activity yet.</div>';
}
async function saveBookingRecordEdits(){
  const saveBtn=document.getElementById('save-booking-record-btn');if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='Saving…';}
  const b=findLiveBooking(activeRecordPkg,activeRecordRef);if(!b){if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='💾 Save Booking Changes';}alert('This booking record could not be found. Refresh the admin system and try again.');return;}
  const snapshot=JSON.parse(JSON.stringify(b));
  const m=getMeta(b);
  const oldDate=b.dateKey;
  const newDate=document.getElementById('edit-date').value;
  const newName=document.getElementById('edit-name').value.trim();
  if(!newName){if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='💾 Save Booking Changes';}alert('Customer / contact name is required.');return;}
  if(!newDate){if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='💾 Save Booking Changes';}alert('Booking date is required.');return;}

  if(newDate&&newDate!==oldDate&&!['cancelled','archived'].includes(document.getElementById('edit-booking-status').value)){
    try{await loadFromSheets();}catch(e){}
    const conflict=await bookingDateConflict(newDate,b.ref);
    if(conflict){alert('That date is already reserved by another booking. No changes were saved.');document.getElementById('edit-date').value=oldDate;if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='💾 Save Booking Changes';}return;}
  }

  b.name=newName;
  b.orgName=document.getElementById('edit-org').value.trim();
  b.phone=document.getElementById('edit-phone').value.trim();
  b.email=document.getElementById('edit-email').value.trim();
  b.address=document.getElementById('edit-address').value.trim();
  b.dateKey=newDate;
  b.startTime=document.getElementById('edit-time').value.trim();
  b.attraction=document.getElementById('edit-attraction').value.trim();
  b.duration=document.getElementById('edit-duration').value.trim();
  b.paymentStatus=document.getElementById('edit-payment-status').value;
  const previousPrice=Number(b.price)||0,previousOriginal=Number(m.originalPrice)||previousPrice,previousDiscount=Number(m.discountAmount)||0,previousCode=m.discountCode||'';
  m.originalPrice=parseFloat(document.getElementById('edit-original-price').value)||0;
  m.discountCode=document.getElementById('edit-discount-code').value.trim();
  m.discountAmount=Math.max(parseFloat(document.getElementById('edit-discount-amount').value)||0,0);
  b.price=Math.max(parseFloat(document.getElementById('edit-price').value)||0,0);
  b.discountCode=m.discountCode;b.discountAmount=m.discountAmount;
  b.amountPaid=parseFloat(document.getElementById('edit-amount-paid').value)||0;
  b.notes=document.getElementById('edit-notes').value.trim();
  m.bookingStatus=document.getElementById('edit-booking-status').value;
  m.contractStatus=document.getElementById('edit-contract-status').value;
  m.balanceDueDate=document.getElementById('edit-balance-due').value;
  if(m.contractStatus==='signed'&&!m.contractAcceptedAt)m.contractAcceptedAt=new Date().toISOString();
  if(m.bookingStatus==='completed'){b.completed=true;b.completedAt=b.completedAt||new Date().toLocaleDateString();}
  else if(b.completed&&m.bookingStatus!=='completed'){b.completed=false;b.completedAt='';}
  let auditMsg=oldDate!==b.dateKey?`Booking edited; date changed from ${oldDate} to ${b.dateKey}`:'Booking record updated';
  if(previousPrice!==Number(b.price)||previousOriginal!==Number(m.originalPrice)||previousDiscount!==Number(m.discountAmount)||previousCode!==m.discountCode){auditMsg+=` · Price: original ${money(m.originalPrice)}, discount ${money(m.discountAmount)}${m.discountCode?' ('+m.discountCode+')':''}, final ${money(b.price)}`;}
  addAudit(b,auditMsg);

  showSaveBanner('Saving booking changes…');
  const ok=await saveBookingToSheet(b);
  if(!ok){
    // Restore the local object so a failed/conflicting DB write never leaves one
    // device showing values that other devices do not have.
    Object.keys(b).forEach(k=>delete b[k]);Object.assign(b,snapshot);
    renderAdmin();try{renderV4Records();}catch(e){}try{renderUltimate();}catch(e){}
    openBookingRecord(activeRecordPkg,activeRecordRef);
    showSaveBanner('⚠️ Nothing changed — shared save was rejected');
    if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='💾 Save Booking Changes';}
    return;
  }
  const fresh=await refreshBookingFromSupabase(b.ref);
  renderAdmin();try{renderV4Records();}catch(e){}try{renderUltimate();}catch(e){}
  if(fresh){activeRecordPkg=fresh.pkgId||activeRecordPkg;activeRecordRef=fresh.ref;}
  openBookingRecord(activeRecordPkg,activeRecordRef);
  showSaveBanner('✅ Changes saved everywhere');
  if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='💾 Save Booking Changes';}
}

function addPaymentRecord(){
  const b=findLiveBooking(activeRecordPkg,activeRecordRef);if(!b)return;const amount=parseFloat(prompt('Payment amount received:','0'));if(!amount||amount<=0)return;const method=prompt('Payment method (Stripe, Cash, Check, Other):','Stripe')||'Other';const type=prompt('Payment type (Deposit, Balance, Payment, Damage Charge):','Payment')||'Payment';const m=getMeta(b);m.payments.unshift({at:new Date().toISOString(),amount,method,type});b.amountPaid=m.payments.reduce((s,x)=>s+(Number(x.amount)||0),0);if(b.amountPaid>=Number(b.price||0)&&b.price>0)b.paymentStatus=method.toLowerCase().includes('cash')?'cash':method.toLowerCase().includes('check')?'check':'stripe';else b.paymentStatus='deposit';addAudit(b,`${type} recorded: ${money(amount)} via ${method}`);saveData();saveBookingToSheet(b);renderAdmin();renderV4Records();openBookingRecord(activeRecordPkg,activeRecordRef);showSaveBanner('💳 Payment recorded');
}
function removePaymentRecord(i){const b=findLiveBooking(activeRecordPkg,activeRecordRef);if(!b)return;if(!confirm('Remove this payment entry?'))return;const m=getMeta(b);const x=m.payments[i];m.payments.splice(i,1);b.amountPaid=m.payments.reduce((s,p)=>s+(Number(p.amount)||0),0);addAudit(b,`Payment entry removed: ${money(x?.amount||0)}`);saveData();saveBookingToSheet(b);renderV4Records();openBookingRecord(activeRecordPkg,activeRecordRef);}
function addAuditNote(){const b=findLiveBooking(activeRecordPkg,activeRecordRef);if(!b)return;const note=prompt('Add an activity note to this booking:');if(!note||!note.trim())return;addAudit(b,note.trim());saveData();saveBookingToSheet(b);renderV4Records();openBookingRecord(activeRecordPkg,activeRecordRef);}

// Extend the original admin renderer with V4 records without replacing it.
const _originalRenderAdmin=renderAdmin;
renderAdmin=function(){_originalRenderAdmin();try{renderV4Records();}catch(e){console.warn('V4 record render error',e);}};

</script>

<script>
// ─────────────────────────────────────────────────────────────
// VIP PARTY PODS ADMIN ULTIMATE V5 · V10.1 AUDITED SYNC
// Professional metadata remains inside checklist.__meta so it syncs
// with the existing booking row without requiring a database migration.
// ─────────────────────────────────────────────────────────────
const ULTIMATE_SETTINGS_KEY='vip_ultimate_settings_v5';
const DEFAULT_ULTIMATE_SETTINGS={balanceDays:7,prepDays:3,mileageRate:0,workerRate:0,staff:[],equipment:['Inflatable / Tent','Blower','Extension Cords','Barriers','Tables','Signage']};
let ultimateSettings={...DEFAULT_ULTIMATE_SETTINGS};
function loadUltimateSettings(){try{ultimateSettings={...DEFAULT_ULTIMATE_SETTINGS,...JSON.parse(localStorage.getItem(ULTIMATE_SETTINGS_KEY)||'{}')};}catch(e){ultimateSettings={...DEFAULT_ULTIMATE_SETTINGS};}}
async function syncUltimateSettingsFromSupabase(){
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/business_settings?key=eq.admin_ultimate_v5&select=value',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
    if(!r.ok)throw new Error('Settings load failed: '+r.status);
    const rows=await r.json();
    let remote=(rows[0]&&rows[0].value)||{};
    // First v10.0 launch: if shared settings are empty but this device already
    // has configured staff/equipment/rates, seed Supabase from that device.
    if(!Object.keys(remote).length){
      let local={};try{local=JSON.parse(localStorage.getItem(ULTIMATE_SETTINGS_KEY)||'{}')||{};}catch(e){}
      if(Object.keys(local).length){ultimateSettings={...DEFAULT_ULTIMATE_SETTINGS,...local};persistUltimateSettings();remote=local;}
    }
    ultimateSettings={...DEFAULT_ULTIMATE_SETTINGS,...remote};
    try{localStorage.setItem(ULTIMATE_SETTINGS_KEY,JSON.stringify(ultimateSettings));}catch(e){}
    try{renderUltimateSettings();renderUltimate();}catch(e){}
    return true;
  }catch(e){console.warn('Shared settings load error:',e.message);return false;}
}
function persistUltimateSettings(){
  try{localStorage.setItem(ULTIMATE_SETTINGS_KEY,JSON.stringify(ultimateSettings));}catch(e){}
  (async()=>{
    try{
      const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=representation'};
      const patch=await fetch(SUPABASE_URL+'/rest/v1/business_settings?key=eq.admin_ultimate_v5',{method:'PATCH',headers,body:JSON.stringify({value:ultimateSettings,updated_at:new Date().toISOString()})});
      if(!patch.ok)throw new Error('Settings update failed: '+patch.status);
      const rows=await patch.json();
      if(!rows.length){
        const ins=await fetch(SUPABASE_URL+'/rest/v1/business_settings',{method:'POST',headers,body:JSON.stringify({key:'admin_ultimate_v5',value:ultimateSettings})});
        if(!ins.ok)throw new Error('Settings insert failed: '+ins.status);
      }
      clearSyncErrorBanner();
    }catch(e){console.warn('Shared settings save error:',e.message);showSyncErrorBanner({type:'saveData'});}
  })();
}
function ensureUltimateMeta(b){const m=getMeta(b);if(!Array.isArray(m.expenses))m.expenses=[];if(!Array.isArray(m.staff))m.staff=[];if(!Array.isArray(m.equipment))m.equipment=[];if(!Array.isArray(m.documents))m.documents=[];if(!Array.isArray(m.tasks))m.tasks=[];if(!m.createdAt)m.createdAt=new Date().toISOString();return m;}
function getCollected(b){const m=ensureUltimateMeta(b);const ledger=m.payments.reduce((s,p)=>s+(Number(p.amount)||0),0);return Math.max(ledger,Number(b.amountPaid)||0);}
function getExpenses(b){return ensureUltimateMeta(b).expenses.reduce((s,x)=>s+(Number(x.amount)||0),0);}
function getProfit(b){return getCollected(b)-getExpenses(b);}
function getBalance(b){if(['promo'].includes(b.paymentStatus))return 0;return Math.max((Number(b.price)||0)-getCollected(b),0);}
function safeText(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function persistBooking(b,msg){if(!b)return false;const snapshot=JSON.parse(JSON.stringify(b));if(msg)addAudit(b,msg);saveLocalCache();showSaveBanner("Saving…");const ok=await saveBookingToSheet(b);if(!ok){Object.keys(b).forEach(k=>delete b[k]);Object.assign(b,snapshot);saveLocalCache();renderAdmin();showSaveBanner("⚠️ Save failed — no shared changes were made");return false;}await refreshBookingFromSupabase(b.ref);renderAdmin();showSaveBanner("✅ Saved everywhere");return true;}
function fmtDate(v){if(!v)return '—';try{return new Date(v+(String(v).length===10?'T12:00:00':'')).toLocaleDateString();}catch(e){return v;}}

function renderUltimateSettings(){loadUltimateSettings();const ids={"setting-balance-days":ultimateSettings.balanceDays,"setting-prep-days":ultimateSettings.prepDays,"setting-mileage-rate":ultimateSettings.mileageRate,"setting-worker-rate":ultimateSettings.workerRate};Object.entries(ids).forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.value=v;});const staff=document.getElementById('staff-roster-tags'),eq=document.getElementById('equipment-roster-tags');if(staff)staff.innerHTML=(ultimateSettings.staff||[]).map((x,i)=>`<span class="settings-tag">${safeText(x)} <button onclick="removeRosterItem('staff',${i})" style="background:none;border:0;color:#F87171;cursor:pointer">×</button></span>`).join('')||'<span style="font-size:11px;color:rgba(255,255,255,.3)">No staff added yet.</span>';if(eq)eq.innerHTML=(ultimateSettings.equipment||[]).map((x,i)=>`<span class="settings-tag">${safeText(x)} <button onclick="removeRosterItem('equipment',${i})" style="background:none;border:0;color:#F87171;cursor:pointer">×</button></span>`).join('');}
function saveUltimateSettings(){ultimateSettings.balanceDays=parseInt(document.getElementById('setting-balance-days').value)||0;ultimateSettings.prepDays=parseInt(document.getElementById('setting-prep-days').value)||0;ultimateSettings.mileageRate=parseFloat(document.getElementById('setting-mileage-rate').value)||0;ultimateSettings.workerRate=parseFloat(document.getElementById('setting-worker-rate').value)||0;persistUltimateSettings();renderUltimateSettings();showSaveBanner('✅ Business settings saved');}
function addRosterItem(type){const label=type==='staff'?'Staff member name':'Equipment item';const v=prompt(label+':');if(!v||!v.trim())return;ultimateSettings[type].push(v.trim());persistUltimateSettings();renderUltimateSettings();}
function removeRosterItem(type,i){ultimateSettings[type].splice(i,1);persistUltimateSettings();renderUltimateSettings();}

function renderUltimate(){loadUltimateSettings();const all=allBookingsV4();all.forEach(ensureUltimateMeta);renderUltimateSettings();renderOperations(all);renderProfitability(all);renderTaskCenter(all);}
function renderOperations(all){const now=new Date();const upcoming=all.filter(b=>!b.completed&&!['cancelled','archived'].includes(ensureUltimateMeta(b).bookingStatus)&&b.dateKey&&new Date(b.dateKey+'T23:59:59')>=now).sort((a,b)=>String(a.dateKey).localeCompare(String(b.dateKey))).slice(0,20);const staffAssigned=upcoming.filter(b=>ensureUltimateMeta(b).staff.length).length;const equipped=upcoming.filter(b=>ensureUltimateMeta(b).equipment.length).length;const openTasks=upcoming.reduce((s,b)=>s+ensureUltimateMeta(b).tasks.filter(t=>!t.done).length,0);const ready=upcoming.filter(b=>getMeta(b).bookingStatus==='ready').length;const sum=document.getElementById('operations-summary');if(sum)sum.innerHTML=`<div class="ultimate-card"><div class="uc-label">Upcoming</div><div class="uc-value">${upcoming.length}</div><div class="uc-sub">Next active rentals / events</div></div><div class="ultimate-card"><div class="uc-label">Staff Assigned</div><div class="uc-value" style="color:#38BDF8">${staffAssigned}/${upcoming.length||0}</div><div class="uc-sub">Upcoming records with staff assigned</div></div><div class="ultimate-card"><div class="uc-label">Loadout Added</div><div class="uc-value" style="color:#A78BFA">${equipped}/${upcoming.length||0}</div><div class="uc-sub">Equipment assigned</div></div><div class="ultimate-card"><div class="uc-label">Open Tasks</div><div class="uc-value" style="color:#FCD34D">${openTasks}</div><div class="uc-sub">Operations follow-ups remaining</div></div><div class="ultimate-card"><div class="uc-label">Marked Ready</div><div class="uc-value" style="color:#34D399">${ready}</div><div class="uc-sub">Ready for event day</div></div>`;const list=document.getElementById('operations-list');if(!list)return;list.innerHTML=`<div class="ops-row header"><div>Date</div><div>Booking / Event</div><div>Attraction</div><div>Staff</div><div>Equipment</div><div>Tasks</div><div></div></div>`+upcoming.map(b=>{const m=ensureUltimateMeta(b);const open=m.tasks.filter(t=>!t.done).length;return `<div class="ops-row"><div><strong>${safeText(b.dateKey)}</strong><br><span style="color:rgba(255,255,255,.35)">${safeText(b.startTime||'')}</span></div><div><strong>${safeText(b.isEvent?(b.orgName||b.name):b.name)}</strong><br><span style="color:#A78BFA">${safeText(b.ref)}</span></div><div>${safeText(b.attraction||b.pkgName||'—')}</div><div><span class="ops-chip">👷 ${m.staff.length}</span></div><div><span class="ops-chip">🎪 ${m.equipment.length}</span></div><div><span class="ops-chip">✅ ${open}</span></div><div><button class="record-action" onclick="openBookingRecord('${b.pkgId}','${b.ref}')">Open</button></div></div>`;}).join('')||'<div style="font-size:12px;color:rgba(255,255,255,.3);padding:15px 0">No upcoming bookings.</div>';}
function renderProfitability(all){const active=all.filter(b=>ensureUltimateMeta(b).bookingStatus!=='cancelled');let booked=0,collected=0,expenses=0;active.forEach(b=>{booked+=Number(b.price)||0;collected+=getCollected(b);expenses+=getExpenses(b)});const profit=collected-expenses,margin=collected?profit/collected*100:0;const sum=document.getElementById('profit-summary');if(sum)sum.innerHTML=`<div class="ultimate-card"><div class="uc-label">Booked Revenue</div><div class="uc-value">${money(booked)}</div><div class="uc-sub">Contracted value</div></div><div class="ultimate-card"><div class="uc-label">Collected Cash</div><div class="uc-value" style="color:#34D399">${money(collected)}</div><div class="uc-sub">Payments recorded</div></div><div class="ultimate-card"><div class="uc-label">Expenses</div><div class="uc-value" style="color:#F87171">${money(expenses)}</div><div class="uc-sub">Event / rental costs recorded</div></div><div class="ultimate-card"><div class="uc-label">Operating Profit</div><div class="uc-value" style="color:#A78BFA">${money(profit)}</div><div class="uc-sub">Collected minus recorded expenses</div></div><div class="ultimate-card"><div class="uc-label">Margin</div><div class="uc-value">${margin.toFixed(1)}%</div><div class="uc-sub">Based on collected revenue</div></div>`;const body=document.getElementById('profit-record-body');if(body)body.innerHTML=[...active].sort((a,b)=>String(b.dateKey).localeCompare(String(a.dateKey))).map(b=>{const c=getCollected(b),e=getExpenses(b),p=c-e,mar=c?p/c*100:0;return `<tr><td>${safeText(b.dateKey||'')}</td><td><strong>${safeText(b.isEvent?(b.orgName||b.name):b.name)}</strong><br><span style="color:#A78BFA;font-size:10px">${safeText(b.ref)}</span></td><td>${money(b.price)}</td><td style="color:#34D399">${money(c)}</td><td style="color:#F87171">${money(e)}</td><td style="font-weight:800">${money(p)}</td><td>${mar.toFixed(1)}%</td><td><button class="record-action" onclick="openBookingRecord('${b.pkgId}','${b.ref}')">Open</button></td></tr>`}).join('')||'<tr><td colspan="8">No records.</td></tr>';}
let adminShowCompletedTasks=false;
function autoTaskKey(t){return String(t.type||t.text||"Auto").replace(/[^a-z0-9]+/gi,"_").toLowerCase();}
function autoTasksForBooking(b){const m=ensureUltimateMeta(b),auto=[];if(!m.autoTaskDone||typeof m.autoTaskDone!=="object")m.autoTaskDone={};if(b.completed||['completed','cancelled','archived'].includes(m.bookingStatus))return auto;if(getBalance(b)>0){const t={auto:true,text:`Collect remaining balance (${money(getBalance(b))})`,due:m.balanceDueDate||b.dateKey,type:'Balance'};t.done=!!m.autoTaskDone[autoTaskKey(t)];auto.push(t);}if(b.isEvent&&m.contractStatus!=='signed'){const t={auto:true,text:'Get event/vendor agreement signed',due:b.dateKey,type:'Contract'};t.done=!!m.autoTaskDone[autoTaskKey(t)];auto.push(t);}if(b.dateKey&&getMeta(b).bookingStatus!=='ready'){const t={auto:true,text:'Complete prep / mark Ready for Event',due:b.dateKey,type:'Prep'};t.done=!!m.autoTaskDone[autoTaskKey(t)];auto.push(t);}return auto;}
function allTaskRows(all){const rows=[];all.forEach(b=>{const autos=autoTasksForBooking(b),m=ensureUltimateMeta(b);autos.forEach((t,i)=>rows.push({b,t,index:i,custom:false}));m.tasks.forEach((t,i)=>rows.push({b,t,index:i,custom:true}));});return rows;}
function toggleCompletedTaskView(){adminShowCompletedTasks=!adminShowCompletedTasks;const btn=document.getElementById("task-completed-toggle");if(btn)btn.textContent=adminShowCompletedTasks?"Hide Completed":"Show Completed";renderTaskCenter(allBookingsV4());}
async function toggleTaskFromCenter(pkgId,ref,custom,index,type){const b=findLiveBooking(pkgId,ref);if(!b)return;const m=ensureUltimateMeta(b);if(custom){const t=m.tasks[index];if(!t)return;t.done=!t.done;await persistBooking(b,`Task ${t.done?'completed':'reopened'}: ${t.text}`);}else{const current=autoTasksForBooking(b).find(t=>t.type===type);if(!current)return;if(!m.autoTaskDone||typeof m.autoTaskDone!=="object")m.autoTaskDone={};const key=autoTaskKey(current);m.autoTaskDone[key]=!current.done;await persistBooking(b,`Automatic task ${m.autoTaskDone[key]?'completed':'reopened'}: ${current.text}`);}renderTaskCenter(allBookingsV4());showSaveBanner("✅ Task updated everywhere");}
function renderTaskCenter(all){const rows=allTaskRows(all),open=rows.filter(x=>!x.t.done),completed=rows.filter(x=>x.t.done),overdue=open.filter(x=>x.t.due&&x.t.due<toDateKey(new Date())).length,due7=open.filter(x=>{if(!x.t.due)return false;const d=(new Date(x.t.due+'T23:59:59')-new Date())/86400000;return d>=0&&d<=7}).length;const sum=document.getElementById('task-summary');if(sum)sum.innerHTML=`<div class="ultimate-card"><div class="uc-label">Open Tasks</div><div class="uc-value">${open.length}</div></div><div class="ultimate-card"><div class="uc-label">Due Next 7 Days</div><div class="uc-value" style="color:#FCD34D">${due7}</div></div><div class="ultimate-card"><div class="uc-label">Overdue</div><div class="uc-value" style="color:#F87171">${overdue}</div></div><div class="ultimate-card"><div class="uc-label">Completed</div><div class="uc-value" style="color:#34D399">${completed.length}</div></div>`;const view=adminShowCompletedTasks?[...open,...completed]:open;const body=document.getElementById('task-record-body');if(body)body.innerHTML=view.sort((a,b)=>String(a.t.due||'9999').localeCompare(String(b.t.due||'9999'))).slice(0,150).map(x=>`<tr style="${x.t.done?'opacity:.55':''}"><td>${safeText(x.t.due||'—')}</td><td><span style="color:#A78BFA;font-weight:700">${safeText(x.b.ref)}</span></td><td>${safeText(x.b.isEvent?(x.b.orgName||x.b.name):x.b.name)}</td><td style="${x.t.done?'text-decoration:line-through':''}">${safeText(x.t.text)}</td><td>${x.t.auto?'<span style="color:#38BDF8">Automatic</span>':'<span style="color:#FCD34D">Custom</span>'}</td><td style="white-space:nowrap"><button class="task-check-btn ${x.t.done?'done':''}" type="button" onclick="toggleTaskFromCenter('${x.b.pkgId}','${x.b.ref}',${x.custom},${x.index},'${safeText(x.t.type||'')}')">${x.t.done?'↩ Reopen':'✓ Complete'}</button> <button class="record-action" type="button" onclick="openBookingRecord('${x.b.pkgId}','${x.b.ref}')">Open</button></td></tr>`).join('')||'<tr><td colspan="6">Nothing needs attention.</td></tr>';}

// Extend booking record modal histories with operating details.
const _renderRecordHistoriesBase=renderRecordHistories;

else if(type==='contracts'){h=['Event Date','Booking Ref','Customer/Organization','Agreement Type','Contract Status','Accepted/Signed Date','Balance Due','Price'];r=all.map(b=>{const m=ensureUltimateMeta(b);return [b.dateKey,b.ref,b.isEvent?(b.orgName||b.name):b.name,m.agreementType,m.contractStatus,m.contractAcceptedAt||'',m.balanceDueDate,b.price]});name='Contracts';}

// Preserve historical records: cancellation and archive never delete a booking row.
cancelBooking=async function(pkgId,ref){
  const b=findLiveBooking(pkgId,ref);if(!b)return;
  if(!confirm('Cancel this booking/event? The record will be retained permanently in history.'))return;
  const m=ensureUltimateMeta(b);m.bookingStatus='cancelled';m.cancelledAt=new Date().toISOString();
  addAudit(b,'Booking cancelled — record retained');await adminReleaseDate(ref);saveData();saveBookingToSheet(b);renderAdmin();showSaveBanner('🚫 Booking cancelled — history retained and date released');
};
archiveOldBookings=function(){
  const cutoff=new Date();cutoff.setFullYear(cutoff.getFullYear()-1);const key=toDateKey(cutoff);
  const old=allBookingsV4().filter(b=>b.dateKey&&b.dateKey<key&&!['archived','cancelled'].includes(ensureUltimateMeta(b).bookingStatus));
  if(!old.length){alert('No eligible bookings older than one year to archive.');return;}
  if(!confirm(`Archive ${old.length} old booking(s)? Records will NOT be deleted.`))return;
  old.forEach(copy=>{const b=findLiveBooking(copy.pkgId,copy.ref);if(!b)return;const m=ensureUltimateMeta(b);m.bookingStatus='archived';m.archivedAt=new Date().toISOString();addAudit(b,'Record archived — retained permanently');saveBookingToSheet(b);});
  saveData();renderAdmin();exportDataset('bookings');showSaveBanner(`🗄️ ${old.length} record(s) archived and retained`);
};

// Keep professional layer and ultimate layer refreshed after every normal admin render.
const _renderAdminUltimateBase=renderAdmin;
renderAdmin=function(){_renderAdminUltimateBase();try{renderUltimate();}catch(e){console.warn('Ultimate render error',e);}};
loadUltimateSettings();
</script>


<script>
// V8.1 WEBSITE LEADS / EVENT QUOTE REQUESTS
let websiteLeads=[];
const LEAD_HEADERS={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
function leadSafe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function localQuoteLeads(){try{return JSON.parse(localStorage.getItem('vip_quote_leads_cache')||'[]')}catch(e){return []}}
async function loadWebsiteLeads(){
  const body=document.getElementById('lead-record-body');
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/owner_list_leads',{method:'POST',headers:LEAD_HEADERS,body:JSON.stringify({p_password:ADMIN_PASSWORD})});
    if(!r.ok)throw new Error('Lead sync '+r.status);
    const remote=await r.json();
    websiteLeads=Array.isArray(remote)?remote:[];
    // Shared DB is authoritative. Local cache is fallback only.
    try{localStorage.setItem('vip_quote_leads_cache',JSON.stringify(websiteLeads));}catch(e){}
  }catch(e){
    websiteLeads=localQuoteLeads();
    if(body&&websiteLeads.length===0)body.innerHTML='<tr><td colspan="7" style="color:#F87171">Leads could not sync right now. Check your connection and refresh.</td></tr>';
  }
  renderWebsiteLeads();
}
function renderWebsiteLeads(){
  const body=document.getElementById('lead-record-body'),sum=document.getElementById('lead-summary');if(!body)return;
  const open=websiteLeads.filter(x=>!['booked','lost','closed'].includes(String(x.status||'new').toLowerCase())).length;
  const fresh=websiteLeads.filter(x=>String(x.status||'new').toLowerCase()==='new').length;
  if(sum)sum.innerHTML=`<div class="attention-item"><div class="metric-label">New Leads</div><div class="metric-value" style="color:#38BDF8">${fresh}</div></div><div class="attention-item"><div class="metric-label">Open Opportunities</div><div class="metric-value" style="color:#FCD34D">${open}</div></div><div class="attention-item"><div class="metric-label">Total Leads</div><div class="metric-value">${websiteLeads.length}</div></div>`;
  body.innerHTML=websiteLeads.map((x,i)=>`<tr><td>${leadSafe(String(x.created_at||'').slice(0,10)||'—')}</td><td><strong>${leadSafe(x.organization||'')}</strong><br><span style="color:rgba(255,255,255,.4)">${leadSafe(x.contact_name||'')}</span></td><td>${leadSafe(x.event_type||'Event')}<br><span style="color:#A78BFA">${leadSafe(x.event_date||'Date TBD')}</span><br><span style="color:rgba(255,255,255,.38)">${leadSafe([x.venue,x.city,x.event_hours].filter(Boolean).join(' · '))}</span></td><td>${leadSafe(x.attractions||'—')}<br><span style="color:rgba(255,255,255,.38)">Attendance: ${leadSafe(x.expected_attendance||'—')}</span></td><td><a href="mailto:${leadSafe(x.email||'')}" style="color:#38BDF8">${leadSafe(x.email||'')}</a><br><a href="tel:${String(x.phone||'').replace(/[^0-9+]/g,'')}" style="color:#38BDF8">${leadSafe(x.phone||'')}</a></td><td><select class="input" style="padding:7px;font-size:11px;min-width:120px" onchange="updateWebsiteLeadStatus(${i},this.value)"><option value="new" ${String(x.status||'new')==='new'?'selected':''}>New</option><option value="contacted" ${x.status==='contacted'?'selected':''}>Contacted</option><option value="quote_sent" ${x.status==='quote_sent'?'selected':''}>Quote Sent</option><option value="follow_up" ${x.status==='follow_up'?'selected':''}>Follow-Up</option><option value="booked" ${x.status==='booked'?'selected':''}>Booked</option><option value="lost" ${x.status==='lost'?'selected':''}>Lost</option></select></td><td style="max-width:260px;white-space:normal">${leadSafe(x.notes||'')}</td></tr>`).join('')||'<tr><td colspan="7" style="color:rgba(255,255,255,.3)">No quote requests yet.</td></tr>';
}
async function updateWebsiteLeadStatus(i,status){
  const x=websiteLeads[i];if(!x)return;
  const old=x.status;x.status=status;renderWebsiteLeads();
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/owner_update_lead_status',{method:'POST',headers:LEAD_HEADERS,body:JSON.stringify({p_password:ADMIN_PASSWORD,p_id:Number(x.id),p_status:status})});
    if(!r.ok||await r.json()!==true)throw new Error('Lead update rejected');
    try{localStorage.setItem('vip_quote_leads_cache',JSON.stringify(websiteLeads));}catch(e){}
    showSaveBanner('✅ Lead updated everywhere');
  }catch(e){x.status=old;renderWebsiteLeads();alert('Lead status could not be saved. Nothing changed.');}
}
function exportWebsiteLeads(){
  const h=['Received','Organization','Contact','Email','Phone','Event Date','Event Type','Venue','City','Event Hours','Attendance','Attractions','Status','Notes'];
  const r=websiteLeads.map(x=>[String(x.created_at||'').slice(0,10),x.organization,x.contact_name,x.email,x.phone,x.event_date,x.event_type,x.venue,x.city,x.event_hours,x.expected_attendance,x.attractions,x.status,x.notes]);
  if(typeof downloadCSV==='function')downloadCSV(`VIP-Party-Pods-Leads-${toDateKey(new Date())}.csv`,h,r);
}
const _renderAdminLeadsBase=renderAdmin;renderAdmin=function(){_renderAdminLeadsBase();loadWebsiteLeads();};
setTimeout(loadWebsiteLeads,800);
</script>



<script>

function bcSafe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

  const fresh=birthdayClubMembers.filter(x=>String(x.status||'New').toLowerCase()==='new').length;
  const redeemed=birthdayClubMembers.filter(x=>x.discount_redeemed).length;
  if(sum)sum.innerHTML=`<div class="attention-item"><div class="metric-label">New Members</div><div class="metric-value" style="color:#F472B6">${fresh}</div></div><div class="attention-item"><div class="metric-label">Next Month Birthdays</div><div class="metric-value" style="color:#FCD34D">${upcoming}</div></div><div class="attention-item"><div class="metric-label">Discounts Used</div><div class="metric-value">${redeemed}</div></div><div class="attention-item"><div class="metric-label">Total Members</div><div class="metric-value">${birthdayClubMembers.length}</div></div>`;
  body.innerHTML=birthdayClubMembers.map((x,i)=>`<tr><td>${bcSafe(String(x.created_at||'').slice(0,10))}</td><td><strong>${bcSafe(x.parent_name)}</strong></td><td>${bcSafe(MONTH_NAMES[Number(x.birthday_month)]||'—')}</td><td>${bcSafe(x.attraction_interest||'Not sure')}</td><td><a href="mailto:${bcSafe(x.email)}" style="color:#38BDF8">${bcSafe(x.email)}</a><br><a href="tel:${String(x.phone||'').replace(/[^0-9+]/g,'')}" style="color:#38BDF8">${bcSafe(x.phone)}</a><br><span style="color:rgba(255,255,255,.35)">${bcSafe(x.zip_code||'')}</span></td><td><select class="input" style="padding:7px;font-size:11px;min-width:115px" onchange="updateBirthdayMember(${i},'status',this.value)"><option ${x.status==='New'?'selected':''}>New</option><option ${x.status==='Contacted'?'selected':''}>Contacted</option><option ${x.status==='Booked'?'selected':''}>Booked</option></select></td><td><button class="soft-btn ${x.discount_redeemed?'':'blue-soft'}" onclick="updateBirthdayMember(${i},'discount_redeemed',${x.discount_redeemed?'false':'true'})">${x.discount_redeemed?'✓ Used':'Mark Used'}</button></td><td><input class="input" style="min-width:170px;padding:7px;font-size:11px" value="${bcSafe(x.notes||'')}" placeholder="Owner notes" onchange="updateBirthdayMember(${i},'notes',this.value)"></td></tr>`).join('')||'<tr><td colspan="8" style="color:rgba(255,255,255,.3)">No Birthday Club signups yet.</td></tr>';
}
async function updateBirthdayMember(i,field,value){
  const x=birthdayClubMembers[i];if(!x)return;
  const old=x[field];x[field]=value;renderBirthdayClubMembers();
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/owner_update_birthday_member',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_password:ADMIN_PASSWORD,p_id:Number(x.id),p_field:field,p_value:String(value)})});
    if(!r.ok||await r.json()!==true)throw new Error('Birthday Club update rejected');
    showSaveBanner('✅ Birthday Club member updated everywhere');
  }catch(e){x[field]=old;renderBirthdayClubMembers();alert('Birthday Club change could not be saved. Nothing changed.');}
}
function exportBirthdayClubMembers(){

  const r=birthdayClubMembers.map(x=>[String(x.created_at||'').slice(0,10),x.parent_name,x.email,x.phone,MONTH_NAMES[Number(x.birthday_month)]||'',x.zip_code,x.attraction_interest,x.status,x.discount_redeemed?'Yes':'No',x.booking_ref,x.notes]);
  if(typeof downloadCSV==='function')downloadCSV(`VIP-Birthday-Club-${toDateKey(new Date())}.csv`,h,r);
}
setTimeout(()=>{try{loadBirthdayClubMembers()}catch(e){}},1200);
</script>

<script>(function(){const frame=document.getElementById('vip-frame'),customer=document.getElementById('customer-template'),admin=document.getElementById('admin-template');function active(id){document.querySelectorAll('.topnav button').forEach(b=>b.classList.remove('active'));document.getElementById('nav-admin')?.classList.remove('active');document.getElementById(id)?.classList.add('active')}function load(tpl,mode){frame.dataset.mode=mode||'';frame.srcdoc=tpl.innerHTML;window.scrollTo(0,0)}window.VIP_APP={openCustomer:function(mode){mode=mode||'book';load(customer,mode);active(mode==='quote'?'nav-quote':mode==='portal'?'nav-portal':'nav-book');document.getElementById('shell-status').textContent='Book a party, request an event quote, or manage an existing booking.';},openAdmin:function(){load(admin,'admin');active('nav-admin');document.getElementById('shell-status').textContent='Business dashboard — bookings, events, leads, customers, payments, operations and reports.';}};VIP_APP.openCustomer('book');})();
let vaultCampaigns=[],vaultParticipants=[],selectedVaultCampaignId=null;
async function vaultRpc(fn,body){const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});if(!r.ok)throw new Error(await r.text());return await r.json()}
function vEsc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function vDate(v){if(!v)return'—';try{return new Date(v).toLocaleString()}catch(e){return String(v)}}
function toggleVaultCreator(){const x=document.getElementById('vault-create-body');if(x)x.classList.toggle('hidden')}
async function loadVaultAdmin(){const body=document.getElementById('vault-campaign-body');if(body)body.innerHTML='<tr><td colspan="7">Loading…</td></tr>';try{const data=await vaultRpc('owner_vault_campaigns',{p_password:ADMIN_PASSWORD});vaultCampaigns=Array.isArray(data)?data:[];renderVaultCampaigns();renderVaultOverview();if(vaultCampaigns.length){const active=vaultCampaigns.find(x=>x.active)||vaultCampaigns[0];if(!selectedVaultCampaignId||!vaultCampaigns.some(x=>Number(x.id)===Number(selectedVaultCampaignId)))selectedVaultCampaignId=Number(active.id);await loadVaultParticipants(selectedVaultCampaignId)}else{const pb=document.getElementById('vault-participant-body');if(pb)pb.innerHTML='<tr><td colspan="6">No Vault campaigns yet.</td></tr>'}}catch(e){if(body)body.innerHTML='<tr><td colspan="7" style="color:#F87171">Unable to load Vault data.</td></tr>'}}
function renderVaultOverview(){const box=document.getElementById('vault-overview');if(!box)return;const active=vaultCampaigns.find(x=>x.active),totalP=vaultCampaigns.reduce((n,x)=>n+Number(x.participant_count||0),0),totalS=vaultCampaigns.reduce((n,x)=>n+Number(x.successful_count||0),0);box.innerHTML=`<div class="attention-card"><div class="attention-label">Current Campaign</div><div class="attention-value" style="font-size:17px">${active?vEsc(active.title):'None active'}</div></div><div class="attention-card"><div class="attention-label">All Vault Participants</div><div class="attention-value">${totalP}</div></div><div class="attention-card"><div class="attention-label">Successful Cracks</div><div class="attention-value">${totalS}</div></div><div class="attention-card"><div class="attention-label">Campaigns Run</div><div class="attention-value">${vaultCampaigns.length}</div></div>`}
function renderVaultCampaigns(){const body=document.getElementById('vault-campaign-body');if(!body)return;if(!vaultCampaigns.length){body.innerHTML='<tr><td colspan="7">No campaigns created yet.</td></tr>';return}body.innerHTML=vaultCampaigns.map(x=>`<tr><td><b>${vEsc(x.title)}</b><div style="font-size:10px;color:rgba(255,255,255,.35)">${x.active?'🟢 Active':'Closed'} · ${vEsc(x.prize_text)}</div></td><td>${vDate(x.vault_open_at)}<br><span style="color:rgba(255,255,255,.35)">to ${vDate(x.vault_close_at)}</span></td><td>${Number(x.participant_count||0)}</td><td>${Number(x.attempt_count||0)}</td><td>${Number(x.successful_count||0)}</td><td>${x.winner_name?'<b style="color:#FCD34D">'+vEsc(x.winner_name)+'</b>':'—'}</td><td><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="soft-btn" onclick="selectVaultCampaign(${Number(x.id)})">View</button>${Number(x.successful_count||0)>0&&!x.winner_name?`<button class="soft-btn green-soft" onclick="pickVaultWinner(${Number(x.id)})">🎉 Pick Winner</button>`:''}${x.active?`<button class="soft-btn amber-soft" onclick="closeVaultCampaign(${Number(x.id)})">Close</button>`:''}</div></td></tr>`).join('')}
async function selectVaultCampaign(id){selectedVaultCampaignId=Number(id);await loadVaultParticipants(id)}
async function loadVaultParticipants(id){const body=document.getElementById('vault-participant-body');if(body)body.innerHTML='<tr><td colspan="6">Loading…</td></tr>';try{const data=await vaultRpc('owner_vault_participants',{p_password:ADMIN_PASSWORD,p_campaign_id:Number(id)});vaultParticipants=Array.isArray(data)?data:[];const c=vaultCampaigns.find(x=>Number(x.id)===Number(id)),title=document.getElementById('vault-participant-title');if(title)title.textContent='Vault Participants'+(c?' — '+c.title:'');if(!body)return;body.innerHTML=vaultParticipants.length?vaultParticipants.map(x=>`<tr><td><b>${vEsc(x.name)}</b><div style="font-size:10px;color:rgba(255,255,255,.35)">First seen ${vDate(x.first_seen_at)}</div></td><td>${vEsc(x.email)}<br>${vEsc(x.phone)}</td><td>${vEsc(x.zip||'—')}</td><td>${Number(x.attempt_count||0)}</td><td>${x.winner?'<b style="color:#FCD34D">🏆 WINNER</b>':x.cracked?'<b style="color:#34D399">✓ Cracked</b>':'Still Trying'}</td><td>${x.email_marketing_consent?'<span style="color:#34D399">✓ Email</span>':'—'}</td></tr>`).join(''):'<tr><td colspan="6">No participants yet.</td></tr>'}catch(e){if(body)body.innerHTML='<tr><td colspan="6" style="color:#F87171">Unable to load participants.</td></tr>'}}
async function createVaultCampaign(){const title=document.getElementById('vault-title').value.trim(),prize=document.getElementById('vault-prize').value.trim(),code=document.getElementById('vault-code').value.trim(),open=document.getElementById('vault-open').value,close=document.getElementById('vault-close').value,msg=document.getElementById('vault-create-msg');if(!title||!code||!open||!close){msg.textContent='Enter a campaign name, secret code, opening time and closing time.';return}if(new Date(close)<=new Date(open)){msg.textContent='Closing time must be after opening time.';return}if(!confirm('Start this new VIP Vault campaign? This closes any currently active Vault.'))return;msg.textContent='Creating campaign…';try{const x=await vaultRpc('owner_vault_create_campaign',{p_password:ADMIN_PASSWORD,p_title:title,p_prize_text:prize,p_code:code,p_open_at:new Date(open).toISOString(),p_close_at:new Date(close).toISOString()});if(!x.ok){msg.textContent=x.message||'Unable to create campaign.';return}msg.textContent='✓ Campaign created. The customer Vault page will automatically use it.';document.getElementById('vault-code').value='';await loadVaultAdmin()}catch(e){msg.textContent='Unable to create campaign.'}}
async function closeVaultCampaign(id){if(!confirm('Close this VIP Vault campaign now?'))return;try{await vaultRpc('owner_vault_close_campaign',{p_password:ADMIN_PASSWORD,p_campaign_id:Number(id)});await loadVaultAdmin()}catch(e){alert('Unable to close campaign.')}}
async function pickVaultWinner(id){if(!confirm('Randomly select one successful entrant as the winner? This result will be saved.'))return;try{const x=await vaultRpc('owner_vault_pick_winner',{p_password:ADMIN_PASSWORD,p_campaign_id:Number(id)});if(!x.ok){alert(x.message||'No eligible entries.');return}alert((x.already_selected?'Winner already selected: ':'Winner selected: ')+x.name+'\n'+x.email+'\n'+x.phone);await loadVaultAdmin()}catch(e){alert('Unable to select winner.')}}
function exportVaultParticipants(){if(!vaultParticipants.length){alert('Select a Vault campaign with participants first.');return}const rows=[['Name','Email','Phone','ZIP','Attempts','Cracked','Winner','Email Marketing']];vaultParticipants.forEach(x=>rows.push([x.name,x.email,x.phone,x.zip,Number(x.attempt_count||0),x.cracked?'Yes':'No',x.winner?'Yes':'No',x.email_marketing_consent?'Yes':'No']));const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='vip-vault-participants.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
