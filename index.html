<section id="s0"><h1>Rental Agreement</h1><div class="muted">Please read our full rental policy and agree before continuing.</div><div class="card policy">SETUP &amp; TAKEDOWN
Our team will deliver, set up, and take down all equipment. The customer must ensure adequate space (30x20x14), access, and a safe setup area free of debris, sharp objects, obstacles, and overhead power lines. If unsafe conditions are present we reserve the right to refuse setup without refund. The customer must ensure all trash and objects not belonging to VIP Party Pods are removed prior to team pickup. Customer must provide access to a reliable power source within 100ft (extension cord provided).

EQUIPMENT USE &amp; CARE
Customers agree to use all equipment properly and follow all provided instructions. No sharp objects, smoking, or open flames inside or near the inflatable structure. Keep all food and drinks away from electronics (speaker, party lights) — food and drink may be placed on provided tables. Clean all spills IMMEDIATELY. LED lights, sound systems, and electronics must not be tampered with or moved. Equipment must not be used in unsafe weather conditions (high winds, heavy rain, or storms). Equipment must not be overloaded beyond recommended capacity (50 people). No climbing on walls, jumping from heights, or misuse of structures. Failure to follow safety rules may result in immediate shutdown without refund.

RESPONSIBILITY, LIABILITY &amp; DAMAGE
The customer assumes full responsibility for all guests and participants. VIP Party Pods is not liable for injuries, accidents, or damages resulting from misuse or unsafe behavior. Adult supervision is required at all times. All equipment will be inspected before and after the rental period; any damage will be documented and communicated to the customer.

CARD ON FILE &amp; DAMAGE POLICY
A valid credit or debit card is required at booking and will be kept securely on file. By completing this booking, the customer authorizes VIP Party Pods LLC to charge the card on file for any damage, missing items, or excessive cleaning fees identified upon inspection following the rental period. If repair or replacement costs exceed $150.00, the customer agrees to pay the additional balance. No damage charge will be applied if all equipment is returned in the same condition as delivered.

WEATHER POLICY
Rentals may be rescheduled due to severe weather at VIP Party Pods discretion. Light rain or normal conditions may not qualify for cancellation. The renter is responsible for monitoring weather during the rental period.

Mandatory Shutdown: The inflatable and all electronics must be shut down immediately if winds exceed 15-20 mph, lightning is visible or thunder is heard, heavy rain or sudden storms occur, or any unsafe ground conditions arise. During a storm, all participants must exit immediately, electronics must be powered off and unplugged, and the air pump must be turned off to deflate the tent — leave all equipment inside in the CENTER of the tent. Damage caused by weather after the renter has followed the shutdown protocol is covered by the company. Damage caused because the renter did not follow the protocol will be billed to the renter.

No Refunds for Weather: Once equipment is delivered and set up, no refunds are issued due to weather. A raincheck credit may be issued to reschedule if weather occurs before the halfway mark of your rental time.

CANCELLATION &amp; RESCHEDULING
- 7+ days before event: full refund of any deposit or payment
- 3-6 days before event: rain check / credit valid for 12 months, no cash refund
- Within 48 hours of event: non-refundable
- You may reschedule one time if done at least 72 hours before your event
- Rescheduled events must occur within 12 months of the original date
- Pricing may adjust if you move to a peak-season date or upgrade equipment
- Rain check credits are valid 12 months, cannot be redeemed for cash, and are non-transferable

async function claimDate(ref){try{const expires=new Date(Date.now()+30*60000).toISOString();let r=await fetch(SUPA_URL+'/rest/v1/rpc/reserve_booking_date',{method:'POST',headers:H,body:JSON.stringify({p_date:date,p_ref:ref,p_hold_expires_at:expires})});if(r.ok){const v=await r.json();return v===true}if(r.status===404||r.status===400)return null;return false}catch(e){return null}}
async function pay(){
  if(birthdayEligible&&birthdayDiscountChoice===null){
    alert('Please choose whether to use your $50 Birthday Club discount now or save it for later.');
    return;
  }

  paybtn.disabled=true;
  paybtn.textContent='Preparing secure checkout…';

  await sync();
  if(unavailable(date)){
    alert('That date was just booked. Please choose another available date.');
    paybtn.disabled=false;
    paybtn.textContent='🔒 Continue to Secure Payment';
    go(2);
    return;
  }

  await checkBirthdayDiscount();

  const ref='VIP-'+Math.random().toString(36).slice(2,8).toUpperCase();
  const p=pack();
  const standardPrice=Number(opt()[1]||0);
  const discount=(birthdayEligible&&birthdayDiscountChoice===true)?Math.min(50,standardPrice):0;
  const price=Math.max(0,standardPrice-discount);

  // Build and validate the Stripe URL BEFORE creating the pending booking.
  const stripeBase=STRIPE[pkg+'|'+duration];
  if(!stripeBase){
    alert('Secure payment is not configured for this package yet. Please contact VIP Party Pods.');
    paybtn.disabled=false;
    paybtn.textContent='🔒 Continue to Secure Payment';
    return;
  }

  let checkoutUrl='';
  try{
    const u=new URL(stripeBase);
    if(discount)u.searchParams.set('prefilled_promo_code','VIPBDAY50');
    checkoutUrl=u.toString();
  }catch(err){
    console.error('Stripe URL error',err);
    alert('We could not prepare the secure Stripe checkout. Please try again.');
    paybtn.disabled=false;
    paybtn.textContent='🔒 Continue to Secure Payment';
    return;
  }

  paybtn.textContent='Holding your date…';
  const lock=await claimDate(ref);
  if(lock!==true){
    alert('That date could not be held for checkout right now. Please choose the date again and retry.');
    paybtn.disabled=false;
    paybtn.textContent='🔒 Continue to Secure Payment';
    go(2);
    return;
  }

  const exp=new Date(Date.now()+30*60000).toISOString();
  const notes='PENDING CHECKOUT | PENDING_CHECKOUT_UNTIL='+exp+' | STANDARD_PRICE='+standardPrice+(discount?' | BIRTHDAY_CLUB_DISCOUNT=50':'');
  const checklist=JSON.stringify({__meta:{
    originalPrice:standardPrice,
    discountAmount:discount,
    discountCode:discount?'VIPBDAY50':'',
    bookingStatus:'awaiting',
    contractStatus:'signed',
    agreementType:'Rental Agreement',
    audit:[{at:new Date().toISOString(),text:discount?'Online checkout started with verified VIP Birthday Club discount of $50':'Online checkout started at standard price '+standardPrice}]
  }});

  try{
    const r=await fetch(SUPA_URL+'/rest/v1/rpc/create_public_booking',{
      method:'POST',
      headers:H,
      body:JSON.stringify({
        p_ref:ref,
        p_name:fn.value.trim()+' '+ln.value.trim(),
        p_email:email.value.trim(),
        p_phone:phone.value.trim(),
        p_address:addr.value.trim()+', '+city.value.trim()+', '+statezip.value.trim(),

        p_pkg_name:p.name,
        p_battle_type:battle||'',
        p_duration:duration,
        p_date_key:date,
        p_start_time:time,
        p_price:price,
        p_notes:notes,
        p_checklist:checklist
      })
    });

    if(!r.ok||await r.json()!==true)throw new Error('Booking reservation was rejected');
  }catch(e){
    console.error('Pending booking creation failed',e);
    try{
      await fetch(SUPA_URL+'/rest/v1/rpc/release_checkout_hold',{
        method:'POST',
        headers:H,
        body:JSON.stringify({p_ref:ref})
      });
    }catch(_e){}
    alert('We could not prepare your booking for payment. Please try again or contact VIP Party Pods.');
    paybtn.disabled=false;
    paybtn.textContent='🔒 Continue to Secure Payment';
    return;
  }

  localStorage.setItem('vip_pending_booking_ref',ref);
  localStorage.setItem('vip_pending_booking_pkg',pkg);
  localStorage.setItem('vip_pending_booking_price',price);
  localStorage.setItem('vip_pending_stripe_url',checkoutUrl);

  // Give the customer a visible fallback before redirecting.
  if(summary){

      ? `<div class="sumrow" style="color:#34D399"><span>🎂 Birthday Club Discount</span><b>-$${discount.toFixed(2)}</b></div>`

    summary.innerHTML=`
      <div class="notice">
        <b>🔒 Your secure checkout is ready.</b>
        <div style="margin-top:6px">Your date is being held temporarily while you complete payment. Tap the Stripe button below to continue.</div>
      </div>
      <div class="sumrow"><span>Booking Reference</span><b>${ref}</b></div>
      <div class="sumrow"><span>Standard Total</span><b>$${standardPrice.toFixed(2)}</b></div>

      <div class="muted" style="margin-top:9px">If Stripe does not open automatically, use the button above.</div>`;
  }

  // Stop here. Do NOT auto-redirect.
  // The customer now taps the native Stripe link shown in the summary.
  // This is more reliable on Safari/iPhone and avoids browser redirect issues.
  paybtn.style.display='none';

  const fallback=document.getElementById('stripe-fallback-link');
  if(fallback){
    fallback.focus();
    fallback.scrollIntoView({behavior:'smooth',block:'center'});
  }
}

        <button class="btn btn-outline" onclick="goToStep(1)">← Back</button>
        <button class="btn btn-disabled" id="btn-dt-next" onclick="goToStep(3)">Continue →</button>

    <!-- STEP 3: CUSTOMER INFO -->

      </div>

      </div>
      <div class="input-group"><label class="input-label">Party Address</label><input class="input" id="address" placeholder="Street Address" oninput="checkInfoForm()"/></div>
      <div class="three-col">
        <div class="input-group"><label class="input-label">City</label><input class="input" id="city" placeholder="City" oninput="checkInfoForm()"/></div>
        <div class="input-group"><label class="input-label">State</label><input class="input" id="state" placeholder="TN" oninput="checkInfoForm()"/></div>
        <div class="input-group"><label class="input-label">ZIP</label><input class="input" id="zip" placeholder="00000" oninput="checkInfoForm()"/></div>

      <div class="btn-row">

    <!-- STEP 4: CONFIRM & PAY -->

        <div class="summary-row" id="sum-end-row"><span>End Time</span><span id="sum-end"></span></div>

        <div class="summary-row"><span>Phone</span><span id="sum-phone"></span></div>
        <div class="summary-row"><span>Party Address</span><span id="sum-address"></span></div>

            <span>New Total</span><span id="sum-discounted-total" style="color:#34D399;"></span>
          </div>
        </div>
      </div>

      <!-- COUPON CODE -->
      <div style="margin-bottom:16px;">
        <div style="display:flex;gap:8px;align-items:center;">
          <input class="input" id="coupon-input" placeholder="Have a coupon code? Enter it here" style="flex:1;margin-bottom:0;" oninput="this.value=this.value.toUpperCase()"/>
          <button onclick="applyCoupon()" style="background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;">Apply</button>
        </div>
        <div id="coupon-message" style="font-size:12px;margin-top:6px;display:none;"></div>
      </div>
      <div class="notice">
        <span>ℹ️</span>
        <span>You'll be taken to our secure Stripe payment page. After checkout, your booking is recorded as awaiting payment verification. Once Stripe payment is verified, your booking can be marked confirmed. Your card authorization remains subject to your Stripe checkout and rental agreement.</span>
      </div>
      <button class="btn-pay" onclick="handlePayment()">🔒 Pay Securely with Stripe →</button>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="goToStep(3)">← Back</button>
      </div>
      <div class="footer">🔒 Powered by Stripe · VIP Party Pods LLC<br/>(423) 255-8034 · Vippartypods@gmail.com</div>
    </div>

    <!-- THANK YOU PAGE -->
    <div id="step-thanks" class="hidden">
      <div style="text-align:center;padding:40px 20px;">
        <div style="font-size:72px;margin-bottom:20px;">🎉</div>
        <div style="font-size:28px;font-weight:800;margin-bottom:10px;background:linear-gradient(135deg,#A78BFA,#E9D5FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">You're on the VIP List!</div>
        <div style="font-size:15px;color:rgba(255,255,255,0.5);margin-bottom:32px;line-height:1.7;">
          Complete your payment on the Stripe page that just opened.<br/>Your booking will appear in our system as awaiting verification until payment is confirmed.
        </div>

        <!-- Booking recap -->
        <div style="background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.2);border-radius:14px;padding:20px 24px;margin-bottom:28px;text-align:left;max-width:480px;margin-left:auto;margin-right:auto;">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:14px;">Your Booking Details</div>
          <div class="summary-row"><span>Package</span><span id="ty-pkg"></span></div>
          <div class="summary-row" id="ty-nerf-row" style="display:none;"><span>Battle Style</span><span id="ty-nerf"></span></div>
          <div class="summary-row"><span>Duration</span><span id="ty-dur"></span></div>
          <div class="summary-row"><span>Date</span><span id="ty-date"></span></div>
          <div class="summary-row"><span>Start Time</span><span id="ty-time"></span></div>
          <div class="summary-row" id="ty-end-row"><span>End Time</span><span id="ty-end"></span></div>
          <div class="summary-row"><span>Booking Ref</span><span id="ty-ref" style="color:#A78BFA;font-weight:700;"></span></div>
          <div class="summary-total"><span>Total</span><span id="ty-total"></span></div>
        </div>

        <div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:10px;padding:14px 18px;font-size:12px;color:rgba(245,158,11,0.85);line-height:1.7;margin-bottom:28px;max-width:480px;margin-left:auto;margin-right:auto;">
          ℹ️ Our team will reach out within 24 hours to confirm setup details for your event. Questions? Call or text us at <strong>(423) 255-8034</strong>.
        </div>

        <a href="https://www.vippartypods.com" style="display:inline-block;padding:14px 36px;border-radius:10px;background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;font-weight:700;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none;box-shadow:0 4px 24px rgba(124,58,237,0.35);">
          ← Back to VIP Party Pods
        </a>

        <div class="footer" style="margin-top:32px;">
          🔒 Powered by Stripe · VIP Party Pods LLC<br/>(423) 255-8034 · Vippartypods@gmail.com
        </div>
      </div>
    </div>

  </div><!-- /page -->
</div><!-- /view-booking -->

async function loadCustomerNotesFromSupabase(){

    // Recover older device-only notes only when that phone has no remote note yet.
    try{

    }catch(e){console.warn('Customer note recovery check failed:',e.message);}
    // Supabase is authoritative. Clearing first also propagates deletions across devices.
    customerNotes = {};
    rows.forEach(row=>{ customerNotes[row.phone] = row.notes; });
    saveCustomerNotes();
    console.log("✅ Loaded customer notes from Supabase:", rows.length);
  } catch(e){ console.warn("Customer notes load error:", e.message); }

}

async function retryLastSync(){
  if(!lastSyncRetryAction){ clearSyncErrorBanner(); return; }

    await saveData();

async function saveBookingToSheet(booking){
  // Single-record authoritative save. Updates the existing row by booking ref;
  // if the row does not exist yet, inserts it. Never deletes/rebuilds the table.
  saveLocalCache();
  try {
    const base = SUPABASE_URL + "/rest/v1/";
    const headers = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };
    const pkgId = booking.pkgId || booking.pkg_id ||
      PACKAGES.find(p=>p.name===booking.pkgName)?.id ||
      PACKAGES.find(p=>p.name===booking.pkg_name)?.id || "";
    const row = {
      ref: booking.ref,
      name: booking.name,
      email: booking.email||"",
      phone: booking.phone||"",
      address: booking.address||"",
      pkg_id: pkgId,
      pkg_name: booking.pkgName||booking.pkg_name||"",
      nerf_type: booking.nerfType||"",
      duration: booking.duration||"",
      date_key: booking.dateKey||"",
      start_time: booking.startTime||"",
      payment_status: booking.paymentStatus||"unpaid",
      amount_paid: Number(booking.amountPaid)||0,
      price: Number(booking.price)||0,
      notes: booking.notes||"",
      source: booking.source||"online",
      completed: booking.completed||false,
      completed_at: booking.completedAt||"",
      checklist: JSON.stringify(booking.checklist||{}),
      is_event: booking.isEvent||false,
      org_name: booking.orgName||"",
      attraction: booking.attraction||"",
      pay_to_play: booking.payToPlay||false
    };

    console.log("🔍 Updating booking:", row.ref);

    // Prefer return=representation so we can prove Supabase accepted the saved values.
    const patchHeaders = {...headers, "Prefer":"return=representation"};
    const patchRes = await fetch(
      base + "bookings?ref=eq." + encodeURIComponent(booking.ref),
      {method:"PATCH", headers:patchHeaders, body:JSON.stringify(row)}
    );
    if(!patchRes.ok){
      const errText=await patchRes.text();
      throw new Error("Booking update failed: "+patchRes.status+" "+errText);
    }
    const patched = await patchRes.json();

    // New/manual record not in Supabase yet: insert it.
    if(!Array.isArray(patched) || patched.length===0){
      const insRes = await fetch(
        base + "bookings",
        {method:"POST", headers:{...headers,"Prefer":"return=representation"}, body:JSON.stringify(row)}
      );
      if(!insRes.ok){
        const errText=await insRes.text();
        throw new Error("Booking insert failed: "+insRes.status+" "+errText);
      }
    }

    clearSyncErrorBanner();
    console.log("✅ Booking confirmed saved in Supabase:", booking.ref);
    return true;
  } catch(e){
    console.error("🔴 Supabase booking save error:", e.name, e.message, e);
    showSyncErrorBanner({type:"saveBooking", payload:booking});
    return false;
  }
}

async function refreshBookingFromSupabase(ref){
  try{
    const base=SUPABASE_URL+"/rest/v1/";
    const headers={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY};
    const res=await fetch(base+"bookings?ref=eq."+encodeURIComponent(ref)+"&select=*",{headers});
    if(!res.ok)throw new Error("Refresh failed: "+res.status);
    const rows=await res.json();
    if(!rows.length)return null;
    const fresh=bookingFromSupabaseRow(rows[0]);

    // Remove stale copies of this ref from every package, then place the
    // authoritative Supabase copy into the correct package list.
    PACKAGES.forEach(p=>{
      bookings[p.id]=(bookings[p.id]||[]).filter(x=>x.ref!==ref);
    });
    const dest=fresh.pkgId || PACKAGES.find(p=>p.name===fresh.pkgName)?.id;
    if(dest){
      if(!bookings[dest])bookings[dest]=[];
      bookings[dest].push(fresh);
    }
    saveLocalCache();
    return fresh;
  }catch(e){
    console.warn("Could not reload authoritative booking:",e.message);
    return null;
  }
}

async function bookingDateConflict(dateKey,ref){
  try{
    const headers={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY};
    const res=await fetch(
      SUPABASE_URL+"/rest/v1/bookings?date_key=eq."+encodeURIComponent(dateKey)+"&select=ref,payment_status,notes,completed",
      {headers}
    );
    if(!res.ok)return false;
    const rows=await res.json();
    return rows.some(x=>{
      if(x.ref===ref)return false;
      const txt=((x.payment_status||"")+" "+(x.notes||"")).toLowerCase();
      if(/cancelled|archived/.test(txt))return false;
      const hold=(x.notes||"").match(/PENDING_CHECKOUT_UNTIL=([^|\s]+)/);
      if(hold && Date.parse(hold[1])<Date.now())return false;
      return true;
    });
  }catch(e){return false;}
}

  saveLocalCache();
  try {
    const base = SUPABASE_URL + "/rest/v1/";
    const headers = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };
    const res = await fetch(base + "bookings?ref=eq." + encodeURIComponent(ref), {method:"DELETE", headers});
    if(res.ok){
      console.log("✅ Booking deleted from Supabase:", ref);
      clearSyncErrorBanner();
    } else {
      console.warn("Supabase delete failed:", res.status);
      showSyncErrorBanner({type:"deleteBooking", payload:ref});
    }
  } catch(e){
    console.warn("Supabase delete error:", e.message);
    showSyncErrorBanner({type:"deleteBooking", payload:ref});
  }
}

async function loadFromSheets(){
  // Local storage is fallback only. After the first successful database load,
  // never re-inject stale device data into the live owner view.
  if(!hasAuthoritativeSupabaseLoad){
    try {
      const cachedBookings = localStorage.getItem("vip_bookings");
      const cachedBlocked = localStorage.getItem("vip_blocked");
      if(cachedBookings) bookings = JSON.parse(cachedBookings);
      if(cachedBlocked) blocked = JSON.parse(cachedBlocked);
      console.log("✅ Loaded local fallback cache while connecting");
      if(!document.getElementById("view-admin").classList.contains("hidden")) renderAdmin();
    } catch(e){ console.warn("localStorage load error:", e.message); }
  }

  // REST sync does not depend on the optional Supabase JS library.
  try {
    const base = SUPABASE_URL + "/rest/v1/";
    const headers = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };

    console.log("🔍 Attempting fetch to:", base + "bookings?select=*&order=date_key");

    // Load bookings
    let bRes;
    try {
      bRes = await fetch(base + "bookings?select=*&order=date_key", {headers});
    } catch(fetchErr){
      console.error("🔴 RAW FETCH ERROR (bookings):", fetchErr.name, fetchErr.message, fetchErr);
      throw fetchErr;
    }
    console.log("🔍 Bookings response status:", bRes.status, bRes.statusText);
    if(!bRes.ok){
      const errText = await bRes.text();
      console.error("🔴 Bookings fetch not ok:", bRes.status, errText);
      throw new Error("Bookings fetch failed: " + bRes.status + " " + errText);
    }
    let bookingRows = await bRes.json();
    console.log("🔍 Bookings rows received:", bookingRows.length);

    // One-time safety migration per device: if an older build created a booking
    // locally but failed to send it to Supabase, upload ONLY refs that do not
    // already exist remotely. Existing Supabase rows are never overwritten here.
    if(!localMigrationChecked){
      localMigrationChecked=true;
      try{
        const remoteRefs=new Set((bookingRows||[]).map(x=>String(x.ref||'')));
        const localOnly=PACKAGES.flatMap(p=>(bookings[p.id]||[]).map(b=>({...b,pkgId:p.id}))).filter(b=>b.ref&&!remoteRefs.has(String(b.ref)));
        for(const b of localOnly){
          const ok=await saveBookingToSheet(b);
          if(ok)console.log('✅ Recovered local-only booking to Supabase:',b.ref);
        }
        if(localOnly.length){
          const rr=await fetch(base + "bookings?select=*&order=date_key", {headers});
          if(rr.ok)bookingRows=await rr.json();
        }
      }catch(e){console.warn('Local booking recovery check failed:',e.message);}
    }

    if(bookingRows){
      // V9.9 CROSS-DEVICE SYNC: Supabase is the single source of truth.
      // Local storage is only a fallback cache when the network/database cannot be reached.
      // Never merge stale device-local bookings back over live database data.
      const fromSupabase = {};
      bookingRows.forEach(row => {
        const b = bookingFromSupabaseRow(row);
        const pkgId = b.pkgId || PACKAGES.find(p=>p.name===b.pkgName)?.id || "";
        if(!pkgId) return;
        if(!fromSupabase[pkgId]) fromSupabase[pkgId]=[];
        fromSupabase[pkgId].push(b);
      });
      PACKAGES.forEach(p=>{ if(!fromSupabase[p.id]) fromSupabase[p.id]=[]; });
      bookings = fromSupabase;
    }

    // Load blocked dates
    let blRes;
    try {
      blRes = await fetch(base + "blocked_dates?select=*", {headers});
    } catch(fetchErr){
      console.error("🔴 RAW FETCH ERROR (blocked_dates):", fetchErr.name, fetchErr.message, fetchErr);
      throw fetchErr;
    }
    if(!blRes.ok){
      const errText = await blRes.text();
      console.error("🔴 Blocked fetch not ok:", blRes.status, errText);
      throw new Error("Blocked fetch failed: " + blRes.status + " " + errText);
    }
    const blockedRows = await blRes.json();

    if(blockedRows){
      const fromSupabaseBlocked = {};
      blockedRows.forEach(row => {
        if(!fromSupabaseBlocked[row.pkg_id]) fromSupabaseBlocked[row.pkg_id]=[];
        if(!fromSupabaseBlocked[row.pkg_id].includes(row.date_key)) fromSupabaseBlocked[row.pkg_id].push(row.date_key);
      });
      blocked = fromSupabaseBlocked;
    }

    hasAuthoritativeSupabaseLoad = true;
    saveLocalCache();
    console.log("✅ Authoritative Supabase sync - Bookings:", bookingRows?.length||0, "Blocked:", blockedRows?.length||0);
    if(!document.getElementById("view-admin").classList.contains("hidden")) renderAdmin();
    // Refresh calendar if on date step
    if(document.getElementById("step-2") && !document.getElementById("step-2").classList.contains("hidden")) renderCalendar();
  } catch(e){
    console.error("🔴 FULL SUPABASE SYNC ERROR:", e);
    console.warn("Supabase sync failed, using localStorage:", e.message);
  }
}

window.onload = function() {
  // Core page init - must always run
  try {
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    const customerPolicy=document.getElementById("policy-text");
    if(customerPolicy) customerPolicy.textContent = POLICY_TEXT;
    const adminPolicy=document.getElementById("admin-policy-text");
    if(adminPolicy) adminPolicy.textContent = POLICY_TEXT;
    buildPackageGrid();
    buildAdminPkgBtns();
    buildFilterPkg();
    renderStepper();
    showStep(0);
    selectedBlockPkgs.add(PACKAGES[0].id);
  } catch(e){ console.error("Core init error:", e); }

  // Database - runs separately so failures dont break the page
  try { initSupabase(); } catch(e){ console.warn("Supabase init error:", e); }

  // URL param handling - runs BEFORE the background Supabase sync so a fresh
  // online booking from Stripe is guaranteed to be saved before any sync can run
  (async function handleUrlParams(){
    try {
      const urlParams = new URLSearchParams(window.location.search);
      if(urlParams.get("owner") === "true") { showView("admin-login"); }
      if(urlParams.get("paid") === "true") {
        const pendingBooking = JSON.parse(localStorage.getItem("vip_pending_booking")||"null");
        if(pendingBooking) {
          const pkgId = pendingBooking.pkgId;
          if(!bookings[pkgId]) bookings[pkgId] = [];
          if(!bookings[pkgId].find(b=>b.ref===pendingBooking.booking.ref)){
            bookings[pkgId].push(pendingBooking.booking);
          }
          saveLocalCache();
          await saveBookingToSheet(pendingBooking.booking);
          localStorage.removeItem("vip_pending_booking");
          showThanksFromData(pendingBooking);
          console.log("⚠️ Online booking returned from Stripe; payment still requires verification:", pendingBooking.booking.ref);
        }
      }
    } catch(e){ console.warn("URL param error:", e); }

    // Only start the background Supabase sync AFTER any pending booking is fully saved
    setTimeout(function(){ try { loadFromSheets(); } catch(e){ console.warn("Load error:", e); } }, 100);
    setTimeout(function(){ try { loadCustomerNotesFromSupabase(); } catch(e){ console.warn("Customer notes load error:", e); } }, 150);
    setTimeout(function(){ try { loadDamageIncidentsFromSupabase(); } catch(e){ console.warn("Damage incidents load error:", e); } }, 200);
  })();
};

function renderCalendar(){
  updateDatetimeSub();const now=new Date();
  document.getElementById("cal-title").textContent=new Date(calYear,calMonth).toLocaleString("default",{month:"long",year:"numeric"});
  const grid=document.getElementById("cal-grid");grid.innerHTML="";
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{const lbl=document.createElement("div");lbl.className="cal-day-label";lbl.textContent=d;grid.appendChild(lbl);});
  const firstDay=new Date(calYear,calMonth,1).getDay();
  for(let i=0;i<firstDay;i++){const e=document.createElement("div");e.className="cal-empty";grid.appendChild(e);}
  const dim=new Date(calYear,calMonth+1,0).getDate();
  for(let i=1;i<=dim;i++){
    const d=new Date(calYear,calMonth,i);
    const isPast=(()=>{const t=new Date(d);t.setHours(23,59,59);return t<now;})();

function isDateUnavailable(d){
  const key=toDateKey(d);
  // Check ALL packages — only 1 tent, so any booking on any package blocks the whole day
  const anyBooked=PACKAGES.some(p=>(bookings[p.id]||[]).some(b=>b.dateKey===key));
  const anyBlocked=PACKAGES.some(p=>(blocked[p.id]||[]).includes(key));
  return anyBooked||anyBlocked;
}

function applyCoupon(){
  const code=document.getElementById("coupon-input").value.trim().toUpperCase();
  const msgEl=document.getElementById("coupon-message");
  const discountRow=document.getElementById("sum-discount-row");
  msgEl.style.display="block";

  if(!code){ msgEl.textContent="Please enter a coupon code."; msgEl.style.color="#F87171"; return; }

  const coupon=COUPONS[code];
  if(!coupon){
    appliedCoupon=null;
    discountRow.style.display="none";
    msgEl.textContent="❌ Invalid coupon code. Please check and try again.";
    msgEl.style.color="#F87171";
    return;
  }

  // Check package restriction if coupon is limited to a specific package/duration
  if(coupon.pkgRestriction){
    const currentCombo=`${selectedPkg}|${selectedDuration}`;
    if(currentCombo!==coupon.pkgRestriction){
      const restrictedPkg=coupon.pkgRestriction.split("|")[0];
      const restrictedDur=coupon.pkgRestriction.split("|")[1];
      const pkgName=PACKAGES.find(p=>p.id===restrictedPkg)?.name||restrictedPkg;
      appliedCoupon=null;
      discountRow.style.display="none";
      msgEl.textContent=`❌ This coupon is only valid for the ${pkgName} — ${restrictedDur}.`;
      msgEl.style.color="#F87171";
      return;
    }
  }

  // Calculate discount
  const pkg=PACKAGES.find(p=>p.id===selectedPkg);
  const dur=pkg.options.find(o=>o.label===selectedDuration);
  const originalPrice=dur.price;
  let discountAmount=0;
  if(coupon.type==="fixed") discountAmount=coupon.amount;
  if(coupon.type==="percent") discountAmount=Math.round(originalPrice*(coupon.amount/100)*100)/100;
  const finalPrice=Math.max(originalPrice-discountAmount, 0);

  appliedCoupon={code, coupon, discountAmount, finalPrice};

  // Update UI
  document.getElementById("sum-discount-amount").textContent=`-$${discountAmount.toFixed(2)}`;
  document.getElementById("sum-discounted-total").textContent=`$${finalPrice.toFixed(2)}`;
  discountRow.style.display="block";
  msgEl.textContent=`✅ Coupon applied! ${coupon.description}`;
  msgEl.style.color="#34D399";
}

function handlePayment(){
  const key=toDateKey(selectedDate),ref="VIP-"+Math.random().toString(36).toUpperCase().slice(2,8);
  const nerfLabel=selectedPkg==="battle-bash-pod"&&selectedNerfType?` — ${selectedNerfType}`:"";
  const pkg2=PACKAGES.find(p=>p.id===selectedPkg);
  const fullPrice=pkg2.options.find(o=>o.label===selectedDuration).price;
  // Use discounted price if a coupon was applied, otherwise use full price
  const finalPrice=appliedCoupon?appliedCoupon.finalPrice:fullPrice;
  const couponCode=appliedCoupon?appliedCoupon.code:null;
  const discountAmount=appliedCoupon?appliedCoupon.discountAmount:0;
  const newOnlineBooking={
    dateKey:key, startTime:selectedTime, duration:selectedDuration, nerfType:selectedNerfType,
    name:`${document.getElementById("firstName").value} ${document.getElementById("lastName").value}`,
    email:document.getElementById("email").value, phone:document.getElementById("phone").value,
    address:`${document.getElementById("address").value}, ${document.getElementById("city").value}, ${document.getElementById("state").value} ${document.getElementById("zip").value}`,
    ref, price:finalPrice, pkgName:pkg2.name, source:"online", paymentStatus:"invoiced",
    amountPaid:0, couponCode, discountAmount,
    notes:couponCode?`Coupon: ${couponCode} (-$${discountAmount})`:""
  };
  // Save as pending. A browser return alone is NOT proof of payment; owner/webhook verification is required.
  try { localStorage.setItem("vip_pending_booking", JSON.stringify({pkgId:selectedPkg, booking:newOnlineBooking, duration:selectedDuration, startTime:selectedTime, dateKey:key})); } catch(e){}
  // Redirect to Stripe in same tab
  const link=STRIPE_LINKS[`${selectedPkg}|${selectedDuration}`];
  const params=new URLSearchParams({client_reference_id:`${selectedPkg}${nerfLabel}-${key}-${ref}`});
  window.location.href=`${link}?${params}`;
}

function showThanksFromData(pendingData){
  const b=pendingData.booking;
  const pkg=PACKAGES.find(p=>p.id===pendingData.pkgId);
  const dur=pkg?.options.find(o=>o.label===b.duration);

async function addManualBooking(){
  const firstName=document.getElementById("mb-firstName").value.trim();
  const lastName=document.getElementById("mb-lastName").value.trim();
  const phone=document.getElementById("mb-phone").value.trim();
  const email=document.getElementById("mb-email").value.trim();
  const address=document.getElementById("mb-address").value.trim();
  const pkgId=document.getElementById("mb-pkg").value;
  const duration=document.getElementById("mb-duration").value;
  const date=document.getElementById("mb-date").value;
  const time=document.getElementById("mb-time").value;
  const payment=document.getElementById("mb-payment").value;
  const amountPaid=document.getElementById("mb-amountpaid").value;
  const notes=document.getElementById("mb-notes").value.trim();
  const errEl=document.getElementById("mb-error");
  const isEvent=mbIsEvent;
  const orgName=isEvent?document.getElementById("mb-org-name").value.trim():"";
  const attraction=isEvent?document.getElementById("mb-attraction").value.trim():"";
  const eventPriceRaw=isEvent?document.getElementById("mb-event-price").value.trim():"";
  const payToPlay=isEvent&&document.getElementById("mb-pay-to-play").value==="yes";

  if(isEvent){
    if(!orgName||!date||(!mbHistorical&&!time)){errEl.textContent="Please fill in: organization name, date, and time.";errEl.classList.remove("hidden");return;}
  }else{
    if(!firstName||!lastName||!phone||!pkgId||!duration||!date||(!mbHistorical&&!time)){errEl.textContent="Please fill in: name, phone, package, duration, date, and time.";errEl.classList.remove("hidden");return;}
    if(pkgId==="battle-bash-pod"&&!mbNerfType){errEl.textContent="Please select a Battle Style (Nerf or Laser Tag).";errEl.classList.remove("hidden");return;}
  }

  // Refresh before the advisory availability check. Supabase still makes the final
  // atomic decision on save, so two phones/computers cannot claim the same date.
  if(!mbHistorical){
    try{await loadFromSheets();}catch(e){}
    const conflict=await bookingDateConflict(date,'');
    if(conflict){errEl.textContent="That date is already booked. Please choose a different date.";errEl.classList.remove("hidden");return;}
  }
  errEl.classList.add("hidden");

  const ref="VIP-"+Math.random().toString(36).toUpperCase().slice(2,8);
  const pkg=PACKAGES.find(p=>p.id===(pkgId||"vip-party-pod"));
  const dur=pkg?.options.find(o=>o.label===duration);
  let finalPrice=0;
  if(isEvent){finalPrice=(payToPlay||eventPriceRaw==="")?0:(parseFloat(eventPriceRaw)||0);}
  else if(dur?.internalOnly){const cp=parseFloat(document.getElementById("mb-custom-price").value);finalPrice=(!isNaN(cp)&&cp>=0)?cp:dur.price;}
  else finalPrice=dur?.price||0;

  const finalPkgId=pkgId||"vip-party-pod";
  const newManualBooking={
    dateKey:date,startTime:time||(mbHistorical?"Unknown / Not Recorded":"TBD"),duration:duration||"Custom",
    nerfType:pkgId==="battle-bash-pod"?mbNerfType:null,
    name:isEvent?(orgName+(firstName?" — "+firstName+" "+lastName:"")):`${firstName} ${lastName}`,
    email,phone,address,ref,price:finalPrice,pkgName:pkg?.name||"Custom Event",pkgId:finalPkgId,
    paymentStatus:payment,amountPaid:parseFloat(amountPaid)||0,
    notes:notes||(isEvent&&attraction?"Attraction: "+attraction:""),source:mbHistorical?"historical":"phone",addedBy:"owner",
    completed:mbHistorical,completedAt:mbHistorical?new Date().toISOString():"",isEvent:isEvent||false,orgName:orgName||"",attraction:attraction||"",payToPlay:payToPlay||false
  };

  showSaveBanner("Saving booking to shared system…");
  const saved=await saveBookingToSheet(newManualBooking);
  if(!saved){
    errEl.textContent="This booking could not be saved. The date may have just been taken on another device. Nothing was added locally.";
    errEl.classList.remove("hidden");
    showSaveBanner("⚠️ Booking was not saved");
    try{await loadFromSheets();renderAdmin();}catch(e){}
    return;
  }

  // Supabase confirmed the booking. Reload the authoritative row before clearing the form.
  await refreshBookingFromSupabase(ref);
  ["mb-firstName","mb-lastName","mb-phone","mb-email","mb-address","mb-notes","mb-amountpaid","mb-date","mb-custom-price","mb-org-name","mb-attraction","mb-event-price"].forEach(id=>{const el=document.getElementById(id);if(el)el.value="";});
  document.getElementById("mb-custom-price-section").classList.add("hidden");
  document.getElementById("mb-event-section").classList.add("hidden");
  mbIsEvent=false;setMBType("regular");
  document.getElementById("mb-pkg").value="";
  document.getElementById("mb-duration").innerHTML='<option value="">Select Duration</option>';
  document.getElementById("mb-time").innerHTML='<option value="">Select Time</option>';
  document.getElementById("mb-payment").value="unpaid";
  document.getElementById("mb-nerf-section").classList.add("hidden");
  document.getElementById("mb-returning-customer").value="";
  document.getElementById("mb-customer-notes-section").classList.add("hidden");
  mbNerfType=null;mbHistorical=false;const hist=document.getElementById("mb-historical");if(hist)hist.checked=false;
  renderAdmin();buildReturningCustomerList();
  showSaveBanner(`✅ Booking saved everywhere for ${newManualBooking.name} on ${date}`);
}

function buildReturningCustomerList(){
  const sel=document.getElementById("mb-returning-customer");
  sel.innerHTML='<option value="">— New Customer / Type Info Below —</option>';
  // Pull every unique customer (by phone number) from booking history across all packages
  const seen=new Set();
  const customers=[];
  PACKAGES.forEach(p=>(bookings[p.id]||[]).forEach(b=>{
    const key=(b.phone||"")+"|"+(b.name||"");
    if(!b.phone||seen.has(key))return;
    seen.add(key);
    customers.push({
      name:b.name||"", email:b.email||"", phone:b.phone||"", address:b.address||""
    });
  }));
  // Sort alphabetically by name for easy finding
  customers.sort((a,b)=>a.name.localeCompare(b.name));
  customers.forEach((c,i)=>{
    const o=document.createElement("option");
    o.value=i;
    o.textContent=`${c.name} — ${c.phone}`;
    o.dataset.name=c.name; o.dataset.email=c.email; o.dataset.phone=c.phone; o.dataset.address=c.address;
    sel.appendChild(o);
  });
  sel._customerData=customers;
}

function fillReturningCustomer(){

  const notesSection=document.getElementById("mb-customer-notes-section");

    ["mb-firstName","mb-lastName","mb-phone","mb-email","mb-address"].forEach(id=>document.getElementById(id).value="");

  }
  const c=sel._customerData[idx];

  const nameParts=c.name.trim().split(" ");
  document.getElementById("mb-firstName").value=nameParts[0]||"";
  document.getElementById("mb-lastName").value=nameParts.slice(1).join(" ")||"";
  document.getElementById("mb-phone").value=c.phone||"";
  document.getElementById("mb-email").value=c.email||"";
  document.getElementById("mb-address").value=c.address||"";
  // Show persistent customer notes if any exist for this phone number
  const notes=customerNotes[c.phone];
  const priorIncidents=damageIncidents.filter(inc=>inc.phone===c.phone);
  let noticeHtml="";
  if(notes) noticeHtml+=notes;
  else noticeHtml+="No notes yet for this customer.";
  if(priorIncidents.length>0){
    noticeHtml+=`<div style="color:#F87171;font-weight:700;margin-top:6px;">⚠️ ${priorIncidents.length} prior damage incident${priorIncidents.length!==1?"s":""} on file: ${priorIncidents.map(i=>i.description).join("; ")}</div>`;

function quickBlockWeekdays(){
  const start=document.getElementById("quick-weekday-start").value;
  const end=document.getElementById("quick-weekday-end").value;
  if(!start||!end){alert("Please pick a start and end date first.");return;}
  if(start>end){alert("Start date must be before end date.");return;}
  let cur=new Date(start+"T12:00:00");const endDate=new Date(end+"T12:00:00");
  let count=0;
  while(cur<=endDate){
    const day=cur.getDay();
    // Block Mon(1) Tue(2) Wed(3) Thu(4) — leave Fri(5) open for evening bookings
    if(day>=1&&day<=4){PACKAGES.forEach(p=>addBlock(p.id,toDateKey(cur)));count++;}
    cur.setDate(cur.getDate()+1);
  }
  document.getElementById("quick-weekday-start").value="";
  document.getElementById("quick-weekday-end").value="";
  const status=document.getElementById("weekday-block-status");
  status.textContent=`✅ Blocked ${count} weekdays (Mon–Thu) across all packages. Fridays remain open from 5:00 PM.`;
  status.style.color="#34D399";
  saveData();
  renderAdmin();
}

function quickUnblockWeekdays(){
  if(!confirm("This will remove ALL Monday–Thursday blocks across all packages. Are you sure?"))return;
  PACKAGES.forEach(p=>{
    blocked[p.id]=(blocked[p.id]||[]).filter(dateKey=>{
      const day=new Date(dateKey+"T12:00:00").getDay();
      return day<1||day>4; // Keep everything that's NOT Mon-Thu
    });
  });
  const status=document.getElementById("weekday-block-status");
  status.textContent="✅ All Monday–Thursday blocks removed. Weekdays are now open for booking.";
  status.style.color="#34D399";
  saveData();
  renderAdmin();
}

function addBlock(pkgId,dateKey){if(!blocked[pkgId])blocked[pkgId]=[];if(!blocked[pkgId].includes(dateKey))blocked[pkgId].push(dateKey);}
function addBlockAll(dateKey){selectedBlockPkgs.forEach(pkgId=>addBlock(pkgId,dateKey));}

function blockSingleDate(){const date=document.getElementById("block-single-date").value;if(!date)return;addBlockAll(date);document.getElementById("block-single-date").value="";saveData();renderAdmin();}

function blockDateRange(){
  const start=document.getElementById("block-range-start").value,end=document.getElementById("block-range-end").value;
  if(!start||!end||start>end)return;
  let cur=new Date(start+"T12:00:00");const endDate=new Date(end+"T12:00:00");
  while(cur<=endDate){addBlockAll(toDateKey(cur));cur.setDate(cur.getDate()+1);}
  document.getElementById("block-range-start").value="";document.getElementById("block-range-end").value="";saveData();renderAdmin();

function rescheduleForWeather(pkgId,ref){
  const booking=bookings[pkgId]?.find(b=>b.ref===ref);
  if(!booking){alert("Booking not found.");return;}
  const newDate=prompt(`Reschedule ${booking.name}'s event due to weather.\n\nCurrent date: ${booking.dateKey}\n\nEnter new date (YYYY-MM-DD):`, booking.dateKey);
  if(newDate===null)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(newDate)){ alert("Please enter a valid date in YYYY-MM-DD format."); return; }
  // Check the new date isn't already booked by someone else (excluding this booking itself)
  const wouldConflict=PACKAGES.some(p=>(bookings[p.id]||[]).some(b=>b.dateKey===newDate&&b.ref!==ref));
  const wouldBeBlocked=PACKAGES.some(p=>(blocked[p.id]||[]).includes(newDate));
  if(wouldConflict||wouldBeBlocked){
    alert("That date is already booked or blocked. Please choose a different date.");
    return;
  }
  const oldDate=booking.dateKey;
  booking.dateKey=newDate;
  booking.notes=(booking.notes?booking.notes+" | ":"")+`Rescheduled from ${oldDate} due to weather.`;
  saveData();
  saveBookingToSheet(booking);
  renderAdmin();
  showSaveBanner(`🌧️ Rescheduled ${booking.name} from ${oldDate} to ${newDate}`);
}

function archiveOldBookings(){
  const now=new Date();
  const oneYearAgo=new Date(now); oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
  const cutoffKey=toDateKey(oneYearAgo);
  const allB=PACKAGES.flatMap(p=>(bookings[p.id]||[]).map(b=>({...b,pkgId:p.id,pkgName:b.pkgName||p.name})));
  const oldBookings=allB.filter(b=>b.dateKey&&b.dateKey<cutoffKey);
  if(!oldBookings.length){
    alert(`No bookings older than 1 year (before ${cutoffKey}) to archive. Your records are already current.`);
    return;
  }
  if(!confirm(`This will permanently remove ${oldBookings.length} booking(s) from before ${cutoffKey} from the active system.\n\nA CSV backup will download automatically BEFORE anything is removed, so you'll have a permanent record.\n\nContinue?`)) return;

  // Export the old bookings as a backup CSV first
  oldBookings.sort((a,b)=>a.dateKey.localeCompare(b.dateKey));
  const headers=["Date","Start Time","Package","Duration","Battle Style","Customer Name","Phone","Email","Address","Payment Status","Amount Paid","Price","Source","Completed","Notes","Booking Ref"];
  const rows=oldBookings.map(b=>[
    b.dateKey||"", b.startTime||"", b.pkgName||"", b.duration||"", b.nerfType||"",
    b.name||"", b.phone||"", b.email||"", b.address||"",
    b.paymentStatus||"unpaid", (b.amountPaid||0).toFixed(2), (b.price||0).toFixed(2),
    b.source||"online", b.completed?"Yes":"No", (b.notes||"").replace(/[\r\n]+/g," "), b.ref||""
  ]);
  const csvEscape=(val)=>{ const s=String(val); return (s.includes(",")||s.includes('"')||s.includes("\n"))?'"'+s.replace(/"/g,'""')+'"':s; };
  const csvContent=[headers,...rows].map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob=new Blob(["\ufeff"+csvContent],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download=`VIP-Party-Pods-ARCHIVE-Backup-${toDateKey(now)}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);

  // Now remove the old bookings from active storage and Supabase
  const refsToRemove=oldBookings.map(b=>b.ref);
  PACKAGES.forEach(p=>{
    bookings[p.id]=(bookings[p.id]||[]).filter(b=>!refsToRemove.includes(b.ref));
  });
  saveData();
  refsToRemove.forEach(ref=>deleteBookingFromSheet(ref));
  renderAdmin();
  showSaveBanner(`🗄️ Archived ${oldBookings.length} booking(s) — backup CSV downloaded`);
}

function exportBookingsCSV(){
  const allB=PACKAGES.flatMap(p=>(bookings[p.id]||[]).map(b=>({...b,pkgId:p.id,pkgName:b.pkgName||p.name})));
  if(!allB.length){ alert("No bookings to export yet."); return; }
  allB.sort((a,b)=>a.dateKey.localeCompare(b.dateKey));
  const headers=["Date","Start Time","Package","Duration","Battle Style","Customer Name","Phone","Email","Address","Payment Status","Amount Paid","Price","Balance Owed","Source","Completed","Notes","Booking Ref"];
  const rows=allB.map(b=>{
    const balance=(b.paymentStatus==="promo"||b.paymentStatus==="partial-promo")?0:Math.max((b.price||0)-(b.amountPaid||0),0);
    return [
      b.dateKey||"", b.startTime||"", b.pkgName||"", b.duration||"", b.nerfType||"",
      b.name||"", b.phone||"", b.email||"", b.address||"",
      b.paymentStatus||"unpaid", (b.amountPaid||0).toFixed(2), (b.price||0).toFixed(2), balance.toFixed(2),
      b.source||"online", b.completed?"Yes":"No", (b.notes||"").replace(/[\r\n]+/g," "), b.ref||""
    ];
  });
  const csvEscape=(val)=>{
    const s=String(val);
    if(s.includes(",")||s.includes('"')||s.includes("\n")) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  };
  const csvContent=[headers,...rows].map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob=new Blob(["\ufeff"+csvContent],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download=`VIP-Party-Pods-Bookings-${toDateKey(new Date())}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  try { localStorage.setItem("vip_last_backup", new Date().toISOString()); } catch(e){}
  checkBackupReminder();
}

function checkBackupReminder(){
  const banner=document.getElementById("backup-reminder-banner");
  const textEl=document.getElementById("backup-reminder-text");
  if(!banner||!textEl)return;
  let lastBackup=null;
  try { lastBackup=localStorage.getItem("vip_last_backup"); } catch(e){}
  const allBCount=PACKAGES.reduce((sum,p)=>sum+(bookings[p.id]||[]).length,0);
  if(allBCount===0){ banner.classList.add("hidden"); return; }
  if(!lastBackup){
    textEl.textContent="📋 You haven't backed up your bookings yet. We recommend exporting a CSV backup weekly.";
    banner.classList.remove("hidden");
    return;
  }
  const daysSince=(new Date()-new Date(lastBackup))/(1000*60*60*24);
  if(daysSince>=7){
    const days=Math.floor(daysSince);
    textEl.textContent=`📋 It's been ${days} day${days!==1?"s":""} since your last backup. We recommend backing up weekly to keep your records safe.`;
    banner.classList.remove("hidden");
  } else {
    banner.classList.add("hidden");
  }
}

  // This Month's Revenue
  const thisMonthKey = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const monthRevenue = allB.filter(b=>b.paymentStatus!=="promo"&&b.paymentStatus!=="partial-promo"&&b.dateKey&&b.dateKey.startsWith(thisMonthKey)).reduce((sum,b)=>sum+(b.price||0),0);
  const monthEl=document.getElementById("stat-month-revenue");
  if(monthEl) monthEl.textContent="$"+monthRevenue.toLocaleString();

  // Next 7 Days count
  const sevenDaysOut = new Date(now); sevenDaysOut.setDate(sevenDaysOut.getDate()+7);
  const next7 = upcoming.filter(b=>!b.completed&&new Date(b.dateKey+"T23:59:59")<=sevenDaysOut);
  const next7El=document.getElementById("stat-next7");
  if(next7El) next7El.textContent=next7.length;

  // Year-to-Date Revenue
  const thisYearKey = String(now.getFullYear());
  const ytdRevenue = allB.filter(b=>b.paymentStatus!=="promo"&&b.paymentStatus!=="partial-promo"&&b.dateKey&&b.dateKey.startsWith(thisYearKey)).reduce((sum,b)=>sum+(b.price||0),0);
  const ytdEl=document.getElementById("stat-ytd-revenue");
  if(ytdEl) ytdEl.textContent="$"+ytdRevenue.toLocaleString();

  // Booking Insights - busiest day of the week
  const insightsEl=document.getElementById("booking-insights");
  if(insightsEl){
    if(allB.length===0){
      insightsEl.innerHTML=`<div style="color:rgba(255,255,255,0.3);">Not enough booking history yet to show insights.</div>`;
    } else {
      const dayNames=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const dayCounts=[0,0,0,0,0,0,0];
      allB.forEach(b=>{
        if(!b.dateKey)return;
        const d=new Date(b.dateKey+"T12:00:00");
        if(!isNaN(d)) dayCounts[d.getDay()]++;
      });
      const maxCount=Math.max(...dayCounts);
      const busiestDayIdx=dayCounts.indexOf(maxCount);
      const busiestDay=maxCount>0?dayNames[busiestDayIdx]:null;
      // Most popular package
      const pkgCounts={};
      allB.forEach(b=>{ const name=b.pkgName||"Unknown"; pkgCounts[name]=(pkgCounts[name]||0)+1; });
      const popularPkg=Object.keys(pkgCounts).length?Object.entries(pkgCounts).sort((a,b)=>b[1]-a[1])[0]:null;
      // Average booking value
      const paidBookings=allB.filter(b=>b.paymentStatus!=="promo"&&b.paymentStatus!=="partial-promo"&&b.price);
      const avgValue=paidBookings.length?(paidBookings.reduce((sum,b)=>sum+b.price,0)/paidBookings.length):0;
      insightsEl.innerHTML=`
        ${busiestDay?`<div style="margin-bottom:6px;">📅 <strong>${busiestDay}</strong> is your busiest day (${maxCount} booking${maxCount!==1?"s":""} historically)</div>`:""}
        ${popularPkg?`<div style="margin-bottom:6px;">⭐ <strong>${popularPkg[0]}</strong> is your most booked package (${popularPkg[1]} booking${popularPkg[1]!==1?"s":""})</div>`:""}
        ${avgValue>0?`<div>💵 Average booking value: <strong>$${avgValue.toFixed(2)}</strong></div>`:""}
      `;
    }
  }

  // Monthly Trend Chart - last 6 months of bookings count + revenue
  const trendEl=document.getElementById("monthly-trend-chart");
  if(trendEl){
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      const label=d.toLocaleString("default",{month:"short",year:"2-digit"});
      const monthBookings=allB.filter(b=>b.dateKey&&b.dateKey.startsWith(key));
      const monthRev=monthBookings.filter(b=>b.paymentStatus!=="promo"&&b.paymentStatus!=="partial-promo").reduce((sum,b)=>sum+(b.price||0),0);
      months.push({label, count:monthBookings.length, revenue:monthRev});
    }
    const maxRev=Math.max(...months.map(m=>m.revenue), 1);
    trendEl.innerHTML=`
      <div style="display:flex;gap:10px;align-items:flex-end;height:140px;padding:10px 0;">
        ${months.map(m=>{
          const heightPct=Math.max((m.revenue/maxRev)*100, m.revenue>0?4:0);
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;">
            <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:4px;">$${m.revenue.toLocaleString()}</div>
            <div style="width:100%;background:linear-gradient(180deg,#A78BFA,#7C3AED);border-radius:6px 6px 0 0;height:${heightPct}%;min-height:${m.revenue>0?'4px':'0'};transition:height 0.3s;"></div>
            <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:6px;">${m.label}</div>
            <div style="font-size:10px;color:rgba(167,139,250,0.6);">${m.count} party${m.count!==1?"s":""}</div>
          </div>`;
        }).join("")}
      </div>
    `;
  }

  // Damage Incident Log
  const damageListEl=document.getElementById("damage-log-list");
  if(damageListEl){
    if(!damageIncidents.length){
      damageListEl.innerHTML=`<div style="font-size:13px;color:rgba(255,255,255,0.3);">No damage incidents reported. Use the ⚠️ Report Damage button on a completed booking to log one.</div>`;
    } else {
      damageListEl.innerHTML=damageIncidents.map(inc=>`
        <div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
          <div style="font-weight:700;font-size:13px;color:#F87171;">${inc.name||"Unknown"} <span style="font-size:11px;color:rgba(255,255,255,0.4);font-weight:400;">${inc.dateKey||""} · ${inc.ref||""}</span></div>
          <div style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:3px;">${inc.description||""}</div>
          <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:3px;">${inc.chargedAmount>0?`Charged: $${inc.chargedAmount.toFixed(2)}`:"No charge recorded yet"} · ${inc.phone||""}</div>
        </div>`).join("");
    }
  }

  // Today's Schedule
  const todayKey = toDateKey(now);
  const todaysParties = allB.filter(b=>b.dateKey===todayKey&&!b.completed).sort((a,b)=>timeToMinutes(a.startTime||"12:00 AM")-timeToMinutes(b.startTime||"12:00 AM"));
  const todayEl=document.getElementById("todays-schedule");
  if(todayEl){
    if(todaysParties.length===0){
      todayEl.innerHTML=`<div style="font-size:13px;color:rgba(255,255,255,0.3);">No parties scheduled for today.</div>`;
    } else {
      todayEl.innerHTML=todaysParties.map(b=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
          <div>
            <div style="font-weight:700;font-size:14px;">${b.name}</div>
            <div style="font-size:12px;color:rgba(255,255,255,0.45);">${b.pkgName} · ${b.startTime}${b.duration!=="All Night"?" – "+getEndTime(b.startTime,b.duration):""}</div>
          </div>
          <div style="font-size:12px;color:rgba(255,255,255,0.4);">${b.phone||""}</div>
        </div>`).join("");
    }
  }

  const blockedList=document.getElementById("blocked-list");
  const wasHidden=blockedList.classList.contains("hidden");
  blockedList.innerHTML="";
  selectedBlockPkgs.forEach(pkgId=>{
    const p=PACKAGES.find(x=>x.id===pkgId);
    const dates=(blocked[pkgId]||[]).sort();
    if(!dates.length){
      const empty=document.createElement("div");
      empty.style.cssText="font-size:12px;color:rgba(255,255,255,0.25);margin-top:12px;";
      empty.textContent=`No dates blocked for ${p.name}.`;
      blockedList.appendChild(empty);return;
    }
    const section=document.createElement("div");section.style.marginTop="16px";
    section.innerHTML=`<div style="font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:8px;">${p.emoji} ${p.name} — ${dates.length} Blocked Date${dates.length!==1?"s":""}</div>`;
    const tags=document.createElement("div");tags.className="blocked-tags";
    dates.forEach(d=>{
      const tag=document.createElement("div");tag.className="blocked-tag";tag.style.cursor="pointer";
      tag.innerHTML=`<span>${d}</span><button class="blocked-tag-remove" onclick="unblockDate('${pkgId}','${d}')">✕ Unblock</button>`;
      tags.appendChild(tag);
    });
    section.appendChild(tags);blockedList.appendChild(section);
  });
  if(wasHidden)blockedList.classList.add("hidden");

  const filterPkg=document.getElementById("filter-pkg").value;
  const filterTime=document.getElementById("filter-time").value;
  const filterPayment=document.getElementById("filter-payment").value;
  const filterSource=document.getElementById("filter-source").value;
  const searchEl=document.getElementById("booking-search");
  const searchTerm=searchEl?searchEl.value.trim().toLowerCase():"";
  let filtered=PACKAGES.flatMap(p=>(bookings[p.id]||[]).map(b=>({...b,pkgId:p.id,pkgName:b.pkgName||p.name})));
  if(filterPkg!=="all")filtered=filtered.filter(b=>b.pkgId===filterPkg);

  // TAB FILTERING
  // CRITICAL: past events stay in "upcoming" until YOU manually mark them completed —
  // they do NOT disappear automatically just because the date passed.
  if(filterTime==="upcoming") filtered=filtered.filter(b=>!b.completed&&b.dateKey&&new Date(b.dateKey+"T23:59:59")>=now);
  if(filterTime==="week"){
    const weekOut=new Date(now); weekOut.setDate(weekOut.getDate()+7);
    filtered=filtered.filter(b=>!b.completed&&new Date(b.dateKey+"T23:59:59")>=now&&new Date(b.dateKey+"T23:59:59")<=weekOut);
  }
  if(filterTime==="month"){
    const monthKey=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
    filtered=filtered.filter(b=>!b.completed&&b.dateKey&&b.dateKey.startsWith(monthKey));
  }
  if(filterTime==="past") filtered=filtered.filter(b=>b.dateKey&&new Date(b.dateKey+"T23:59:59")<now);
  if(filterTime==="pastparties") filtered=filtered.filter(b=>!b.isEvent&&b.dateKey&&new Date(b.dateKey+"T23:59:59")<now);
  if(filterTime==="pastevents") filtered=filtered.filter(b=>b.isEvent===true&&b.dateKey&&new Date(b.dateKey+"T23:59:59")<now);
  if(filterTime==="completed") filtered=filtered.filter(b=>b.completed===true);
  if(filterTime==="all") filtered=filtered;
  if(filterTime==="events") filtered=filtered.filter(b=>b.isEvent===true&&!b.completed&&b.dateKey&&new Date(b.dateKey+"T23:59:59")>=now);
  if(filterTime==="invoiced") filtered=filtered.filter(b=>b.paymentStatus==="invoiced"&&!b.completed);

  // Optional owner date-range filter. Inclusive on both ends.
  const rangeFrom=document.getElementById("booking-date-from")?.value||"";
  const rangeTo=document.getElementById("booking-date-to")?.value||"";
  if(rangeFrom) filtered=filtered.filter(b=>b.dateKey&&b.dateKey>=rangeFrom);
  if(rangeTo) filtered=filtered.filter(b=>b.dateKey&&b.dateKey<=rangeTo);

  if(filterPayment==="unpaid")filtered=filtered.filter(b=>b.paymentStatus==="unpaid"||b.paymentStatus==="deposit"||!b.paymentStatus);
  if(filterPayment==="invoiced")filtered=filtered.filter(b=>b.paymentStatus==="invoiced");
  if(filterPayment==="paid")filtered=filtered.filter(b=>b.paymentStatus==="cash"||b.paymentStatus==="check"||b.paymentStatus==="stripe");
  if(filterPayment==="promo")filtered=filtered.filter(b=>b.paymentStatus==="promo"||b.paymentStatus==="partial-promo");
  if(filterSource==="online")filtered=filtered.filter(b=>b.source==="online");
  if(filterSource==="phone")filtered=filtered.filter(b=>b.source==="phone"&&!b.isEvent);
  if(filterSource==="event")filtered=filtered.filter(b=>b.isEvent===true);
  // Search includes org name and attraction for events
  if(searchTerm)filtered=filtered.filter(b=>
    (b.name||"").toLowerCase().includes(searchTerm)||
    (b.phone||"").toLowerCase().includes(searchTerm)||
    (b.orgName||"").toLowerCase().includes(searchTerm)||
    (b.ref||"").toLowerCase().includes(searchTerm)
  );
  if(filterTime==="past"||filterTime==="pastparties"||filterTime==="pastevents"||filterTime==="completed"){
    filtered.sort((a,b)=>String(b.dateKey||"").localeCompare(String(a.dateKey||"")));
  }else{
    filtered.sort((a,b)=>String(a.dateKey||"").localeCompare(String(b.dateKey||"")));
  }

  const list=document.getElementById("bookings-list");
  if(!filtered.length){
    const msgs={completed:"No completed parties or events found.",upcoming:"No upcoming parties or events.",week:"No parties or events this week.",month:"No parties or events this month.",past:"No past records found.",pastparties:"No past parties found in this view/date range.",pastevents:"No past events found in this view/date range.",events:"No current or upcoming special events found.",invoiced:"No invoiced bookings found."};
    list.innerHTML=`<div class="admin-card" style="text-align:center;color:rgba(255,255,255,0.3);font-size:13px;">${msgs[filterTime]||"No bookings found."}</div>`;
    return;
  }
  list.innerHTML="";
  filtered.forEach(b=>{
    const isPast=new Date(b.dateKey+"T23:59:59")<now;
    const isCompleted=b.completed===true;
    const card=document.createElement("div");
    card.className="admin-card";
    card.style.opacity=isCompleted?"0.7":isPast?"0.85":"1";
    if(isCompleted) card.style.borderColor="rgba(16,185,129,0.3)";
    if(b.isEvent) card.style.borderColor="rgba(251,191,36,0.3)";
    const endTime=b.duration!=="All Night"?`· Ends ${getEndTime(b.startTime,b.duration)}`:"";
    const nerfLabel=b.nerfType?` · ${b.nerfType}`:"";
    let timeBadge="";
    if(isCompleted) timeBadge=`<span style="background:rgba(16,185,129,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#34D399;margin-left:6px;">✅ Completed ${b.completedAt||""}</span>`;
    else if(isPast) timeBadge=`<span style="background:rgba(239,68,68,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#F87171;margin-left:6px;">⚠️ Past — Not Completed</span>`;
    else timeBadge=`<span style="background:rgba(16,185,129,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#34D399;margin-left:6px;">Upcoming</span>`;
    const eventBadge=b.isEvent?`<span style="background:rgba(251,191,36,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#FCD34D;margin-left:6px;">🏟️ Event</span>`:"";
    const invoicedBadge=b.paymentStatus==="invoiced"?`<span style="background:rgba(56,189,248,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#38BDF8;margin-left:6px;">📄 Invoice Sent</span>`:``;
    // Follow-up flag: event coming up soon (within 7 days) and still owes money
    const daysUntil=(new Date(b.dateKey+"T23:59:59")-now)/(1000*60*60*24);
    const stillOwes=!b.completed&&(!b.paymentStatus||b.paymentStatus==="unpaid"||b.paymentStatus==="deposit");
    const isDepositOnly=b.paymentStatus==="deposit";
    const needsFollowUp=!isPast&&!isCompleted&&stillOwes&&daysUntil<=7&&daysUntil>=0;
    const followUpBadge=needsFollowUp
      ?(isDepositOnly
        ?`<span style="background:rgba(239,68,68,0.25);border-radius:20px;padding:2px 8px;font-size:10px;color:#F87171;margin-left:6px;font-weight:700;">🚨 Deposit Only — Event in ${Math.ceil(daysUntil)} Day${Math.ceil(daysUntil)!==1?"s":""}, Collect Balance!</span>`
        :`<span style="background:rgba(245,158,11,0.2);border-radius:20px;padding:2px 8px;font-size:10px;color:#FCD34D;margin-left:6px;font-weight:700;">⚠️ Follow Up — Event Soon, Balance Owed</span>`)
      :"";
    const sourceBadge=b.source==="phone"?`<span style="background:rgba(14,165,233,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#38BDF8;margin-left:6px;">📞 Phone</span>`:`<span style="background:rgba(167,139,250,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#A78BFA;margin-left:6px;">🌐 Online</span>`;
    let payBadge="";
    const ps=b.paymentStatus;
    if(!ps||ps==="unpaid") payBadge=`<span style="background:rgba(239,68,68,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#F87171;margin-left:6px;">💰 Unpaid</span>`;
    else if(ps==="deposit") payBadge=`<span style="background:rgba(245,158,11,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#FCD34D;margin-left:6px;">💰 Deposit Only</span>`;
    else if(ps==="cash") payBadge=`<span style="background:rgba(16,185,129,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#34D399;margin-left:6px;">✅ Paid — Cash</span>`;
    else if(ps==="check") payBadge=`<span style="background:rgba(16,185,129,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#34D399;margin-left:6px;">✅ Paid — Check</span>`;
    else if(ps==="stripe") payBadge=`<span style="background:rgba(16,185,129,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#34D399;margin-left:6px;">✅ Paid — Stripe</span>`;
    else if(ps==="promo") payBadge=`<span style="background:rgba(167,139,250,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#A78BFA;margin-left:6px;">🎁 Promo — Write Off</span>`;
    else if(ps==="partial-promo") payBadge=`<span style="background:rgba(167,139,250,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#A78BFA;margin-left:6px;">🎁 Partial Promo</span>`;
    const isPromo=ps==="promo"||ps==="partial-promo";
    const isPaid=ps==="cash"||ps==="check"||ps==="stripe";
    const amtPaid=isPaid&&b.amountPaid>0?`<span style="color:rgba(255,255,255,0.4);font-size:11px;margin-left:4px;">($${b.amountPaid} paid)</span>`:"";
    const balance=!isPromo&&!isPaid&&b.price?`<span style="color:#F87171;font-size:11px;margin-left:4px;">Balance owed: $${(b.price-(b.amountPaid||0)).toFixed(2)}</span>`:"";
    const notesLine=b.notes?`<div style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px;font-style:italic;">📝 ${b.notes}</div>`:"";
    const addressLine=b.address?`<div style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px;">📍 ${b.address}</div>`:"";
    const totalDisplay=isPromo?`<span style="color:#A78BFA;">Complimentary</span>`:b.payToPlay?`<span style="color:#FCD34D;">TBD (Pay-to-Play)</span>`:`$${b.price||"—"}`;
    const showMarkPaid=!isPaid&&!isPromo&&!isCompleted&&b.source!=="online";
    const showComplete=!isCompleted;
    // Returning customer badge
    const customerBookingCount=b.phone?PACKAGES.reduce((sum,p)=>sum+(bookings[p.id]||[]).filter(bk=>bk.phone===b.phone).length,0):0;
    const returningBadge=customerBookingCount>=2?`<span style="background:rgba(252,211,77,0.15);border-radius:20px;padding:2px 8px;font-size:10px;color:#FCD34D;margin-left:6px;font-weight:700;">⭐ Returning (${customerBookingCount})</span>`:"";
    const phoneDigits=(b.phone||"").replace(/[^0-9]/g,"");
    const callTextButtons=phoneDigits?`
          <div style="display:flex;gap:6px;">
            <a href="tel:${phoneDigits}" style="flex:1;text-align:center;padding:6px 10px;border-radius:8px;border:1px solid rgba(56,189,248,0.3);background:rgba(56,189,248,0.1);color:#38BDF8;font-size:11px;font-weight:700;text-decoration:none;">📞 Call</a>
            <a href="sms:${phoneDigits}" style="flex:1;text-align:center;padding:6px 10px;border-radius:8px;border:1px solid rgba(56,189,248,0.3);background:rgba(56,189,248,0.1);color:#38BDF8;font-size:11px;font-weight:700;text-decoration:none;">💬 Text</a>
          </div>`:"";
    // Event-specific details line
    const eventLine=b.isEvent?`<div style="font-size:12px;color:#FCD34D;margin-top:4px;">🏟️ ${b.orgName||""} ${b.attraction?" — "+b.attraction:""}</div>`:"";
    // Checklist
    const checklistItems=[
      {key:"tentInflated",label:"Tent inflated & secure"},{key:"lightsTested",label:"Lights tested"},
      {key:"cordsChecked",label:"Cords checked & safely placed"},{key:"equipmentDelivered",label:"All equipment delivered"},
      {key:"siteCleanOnPickup",label:"Site clean on pickup"},{key:"equipmentReturnedIntact",label:"Equipment returned in good condition"}
    ];
    const checklist=b.checklist||{};
    const checkedCount=checklistItems.filter(item=>checklist[item.key]).length;
    const checklistHtml=checklistItems.map(item=>`
      <label style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;color:rgba(255,255,255,0.7);cursor:pointer;">
        <input type="checkbox" ${checklist[item.key]?"checked":""} onchange="toggleChecklistItem('${b.pkgId}','${b.ref}','${item.key}')" style="width:16px;height:16px;cursor:pointer;"/>
        ${item.label}
      </label>`).join("");

    const displayName=b.isEvent?(b.orgName||b.name):b.name;

    card.innerHTML=`
      <div class="booking-item">
        <div style="flex:1;">
          <div class="booking-name">${displayName} <span class="booking-ref">${b.ref}</span>${timeBadge}${eventBadge}${invoicedBadge}${returningBadge}</div>
          ${b.isEvent?"":` <div style="font-size:12px;color:rgba(255,255,255,0.4);">${b.name}</div>`}
          <div style="margin-top:4px;">${payBadge}${amtPaid}${balance}</div>
          ${eventLine}
          <div class="booking-detail" style="margin-top:6px;">${b.pkgName}${nerfLabel} · ${b.duration} · Starts ${b.startTime} ${endTime}</div>
          <div class="booking-detail">${b.email||"No email"} · ${b.phone}</div>
          ${addressLine}
          <div class="booking-date">📅 ${b.dateKey} · Total: ${totalDisplay}</div>
          ${notesLine}
          <button onclick="toggleChecklistSection('${b.ref}')" style="margin-top:10px;background:transparent;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);padding:5px 12px;border-radius:8px;font-size:11px;cursor:pointer;">📋 Setup Checklist (${checkedCount}/${checklistItems.length})</button>
          <div id="checklist-${b.ref}" class="hidden" style="margin-top:8px;padding:10px 12px;background:rgba(255,255,255,0.03);border-radius:8px;">
            ${checklistHtml}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end;min-width:140px;">
          ${callTextButtons}
          <button onclick="openBookingRecord('${b.pkgId}','${b.ref}')" style="padding:7px 12px;border-radius:8px;border:1px solid rgba(167,139,250,.38);background:rgba(124,58,237,.12);color:#C4B5FD;font-size:11px;font-weight:800;cursor:pointer;width:100%;">✎ View / Edit</button>

function toDateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function formatDate(d){return d?d.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"}):""; }
function hexToRgb(hex){return `${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)}`;}
function timeToMinutes(t){const [tp,period]=t.split(" ");let [h,m]=tp.split(":").map(Number);if(period==="PM"&&h!==12)h+=12;if(period==="AM"&&h===12)h=0;return h*60+m;}
function minutesToTime(mins){const h=Math.floor(mins/60)%24,m=mins%60,period=h>=12?"PM":"AM",dH=h>12?h-12:h===0?12:h;return `${dH}:${m.toString().padStart(2,"0")} ${period}`;}
function getEndTime(startTime,duration){if(duration==="All Night")return "Morning pickup";return minutesToTime(timeToMinutes(startTime)+DURATION_HOURS[duration]*60);}
function getAvailableTimes(duration){
  if(duration==="All Night"){ return ["7:00 PM"]; }
  if(duration==="12 Hours"){
    // Vendor/internal events - any start time is fine, no 9:30 PM cutoff,
    // since this is only ever booked manually by the owner, not customers.
    return ALL_TIMES;
  }
  // For all other durations (4hr, 6hr) on ANY day including Friday:
  // party must end by 9:30 PM. This applies to Friday too —
  // if they want to go later on a Friday they need the All Night option.
  const maxEnd=timeToMinutes("9:30 PM");
  return ALL_TIMES.filter(t=>timeToMinutes(t)+DURATION_HOURS[duration]*60<=maxEnd);
}
